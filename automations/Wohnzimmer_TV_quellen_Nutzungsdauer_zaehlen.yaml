# ++
# ++ TV Quellen-Tracking
# ++
# Trackt jede Minute die aktuell aktive TV-Quelle (Netflix, YouTube, Prime Video,
# Disney+, Plex, HDMI, TV, ARD Mediathek, HD+, Joyn, ZDF) und inkrementiert den entsprechenden Zähler.
# Wenn keine bekannte Quelle aktiv ist, wird der "Andere"-Zähler erhöht.
# Die Statistiken werden täglich um Mitternacht zurückgesetzt.
# ++

- id: '1753081050526'
  alias: Wohnzimmer_TV_quellen_Nutzungsdauer_zählen
  description: Trackt minutenweise die aktive TV-Quelle in separaten Zählern
  triggers:
  - minutes: /1
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: media_player.wohnzimmer_tv_samsung_q90_series_75
    state: 'on'
  actions:
  # Debug: Log aktuelle Quelle
  - service: system_log.write
    data:
      level: info
      message: >
        TV Quellen-Debug: Aktuelle Quelle ist '{{ state_attr('media_player.wohnzimmer_tv_samsung_q90_series_75','source') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set src = state_attr(''media_player.wohnzimmer_tv_samsung_q90_series_75'',''source'') | lower | trim %}
          {{ src == ''hdmi'' }}'
      sequence:
      - target:
          entity_id: input_number.wohnzimmer_tv_minute_count_hdmi
        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_hdmi'') | int(0) + 1 }}'
        service: input_number.set_value
    - conditions:
      - condition: template
        value_template: '{% set src = state_attr(''media_player.wohnzimmer_tv_samsung_q90_series_75'',''source'') | lower | trim %}
          {{ src == ''netflix'' }}'
      sequence:
      - target:
          entity_id: input_number.wohnzimmer_tv_minute_count_netflix
        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_netflix'') | int(0) + 1 }}'
        service: input_number.set_value
    - conditions:
      - condition: template
        value_template: '{% set src = state_attr(''media_player.wohnzimmer_tv_samsung_q90_series_75'',''source'') | lower | trim %}
          {{ src == ''youtube'' }}'
      sequence:
      - target:
          entity_id: input_number.wohnzimmer_tv_minute_count_youtube
        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_youtube'') | int(0) + 1 }}'
        service: input_number.set_value
    - conditions:
      - condition: template
        value_template: '{% set src = state_attr(''media_player.wohnzimmer_tv_samsung_q90_series_75'',''source'') | lower | trim %}
          {{ src == ''prime video'' }}'
      sequence:
      - target:
          entity_id: input_number.wohnzimmer_tv_minute_count_prime
        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_prime'') | int(0) + 1 }}'
        service: input_number.set_value
    - conditions:
      - condition: template
        value_template: '{% set src = state_attr(''media_player.wohnzimmer_tv_samsung_q90_series_75'',''source'') | lower | trim %}
          {{ src == ''disney+'' }}'
      sequence:
      - target:
          entity_id: input_number.wohnzimmer_tv_minute_count_disney
        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_disney'') | int(0) + 1 }}'
        service: input_number.set_value
    - conditions:
      - condition: template
        value_template: '{% set src = state_attr(''media_player.wohnzimmer_tv_samsung_q90_series_75'',''source'') | lower | trim %}
          {{ src == ''plex'' }}'
      sequence:
      - target:
          entity_id: input_number.wohnzimmer_tv_minute_count_plex
        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_plex'') | int(0) + 1 }}'
        service: input_number.set_value
    - conditions:
      - condition: template
        value_template: '{% set src = state_attr(''media_player.wohnzimmer_tv_samsung_q90_series_75'',''source'') | lower | trim %}
          {{ src == ''tv'' }}'
      sequence:
      - target:
          entity_id: input_number.wohnzimmer_tv_minute_count_tv
        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_tv'') | int(0) + 1 }}'
        service: input_number.set_value
    - conditions:
      - condition: template
        value_template: '{% set src = state_attr(''media_player.wohnzimmer_tv_samsung_q90_series_75'',''source'') | lower | trim %}
          {{ src == ''ard mediathek – streaming für alle'' }}'
      sequence:
      - target:
          entity_id: input_number.wohnzimmer_tv_minute_count_ard
        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_ard'') | int(0) + 1 }}'
        service: input_number.set_value
    - conditions:
