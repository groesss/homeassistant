        data:
          value: '{{ states(''input_number.wohnzimmer_tv_minute_count_zdf'') | int(0) + 1 }}'
        service: input_number.set_value
    default:
    - service: system_log.write
      data:
        level: warning
        message: >
          TV Quellen-Tracking: Unbekannte Quelle '{{ state_attr('media_player.wohnzimmer_tv_samsung_q90_series_75','source') }}' (Original) 
          oder '{{ state_attr('media_player.wohnzimmer_tv_samsung_q90_series_75','source') | lower | trim }}' (Normalisiert) gezählt!
    - target:
        entity_id: input_number.wohnzimmer_tv_minute_count_andere
      data:
        value: '{{ states(''input_number.wohnzimmer_tv_minute_count_andere'') | int(0) + 1 }}'
      service: input_number.set_value
  mode: single
