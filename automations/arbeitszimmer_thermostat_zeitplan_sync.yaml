# ++
# ++ Arbeitszimmer Thermostat Zeitplan-Synchronisation
# ++
# Synchronisiert die UI-Helper (input_datetime, input_number) mit dem internen
# Zeitplan des Thermostats. Unterstützt zwei Modi:
# - "Gleich für alle Tage": Ein gemeinsamer Zeitplan für Mo-So
# - "Individuell": Separate Zeitpläne für jeden Wochentag
# Ermöglicht komfortable UI-Steuerung mit automatischer Thermostat-Aktualisierung.
# ++

- id: '1769991000000'
  alias: Arbeitszimmer_Thermostat_Zeitplan_sync
  description: Synchronisiert UI-Helper mit Thermostat-Zeitplan (täglich oder individuell)
