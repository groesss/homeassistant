# ++
# ++ Garten Gardena Bewässerungszeitplan
# ++
# Automatische Bewässerung nach konfigurierbarem Zeitplan:
# - Morgens und/oder abends (separate Zeiten einstellbar)
# - Wochentagabhängig (einzelne Tage aktivierbar)
# - Konfigurierbare Bewässerungsdauer
# Öffnet das Ventil zur eingestellten Zeit und schließt es automatisch nach Ablauf.
# ++

- id: '1756481008405'
  alias: Garten_Gardena_Zeitplan_Bewässerung
  description: Öffnet das Gardena Ventil morgens oder abends nach Zeitplan, nur an
    aktivierten Wochentagen.
  triggers:
  - at: input_datetime.gardena_morgen_start
    id: slot_1
    trigger: time
  - at: input_datetime.gardena_abend_start
    id: slot_2
    trigger: time
  conditions:
  - condition: template
    value_template: "{% set day = now().weekday() %} {% set booleans = [\n  'input_boolean.gardena_mo',\n
      \ 'input_boolean.gardena_di',\n  'input_boolean.gardena_mi',\n  'input_boolean.gardena_do',\n
      \ 'input_boolean.gardena_fr',\n  'input_boolean.gardena_sa',\n  'input_boolean.gardena_so']
      %}\n{{ is_state(booleans[day], 'on') }}\n"
  actions:
  - variables:
      run_minutes: >
        {% if trigger.id == 'slot_1' %}
          {{ states('input_number.gardena_dauer') | int(5) }}
        {% else %}
          {{ states('input_number.gardena_dauer_2') | int(10) }}
        {% endif %}
  - target:
      entity_id: valve.garten_gardena_ventil_1
    service: valve.open
  - data:
      message: 'Gardena Ventil geöffnet um {{ now().strftime(''%H:%M'') }} für {{
        run_minutes | int }} Minuten.

        '
      level: info
    service: system_log.write
  - delay:
      minutes: '{{ run_minutes | int }}'
  - target:
      entity_id: valve.garten_gardena_ventil_1
    service: valve.close
  - data:
      message: Gardena Ventil geschlossen um {{ now().strftime('%H:%M') }}
      level: info
    service: system_log.write
  mode: restart

- id: '1759498200001'
  alias: Garten_Gardena_Ventil_1_Laufhistorie
  description: Schreibt letzten Start/Stop und kompakte Laufhistorie fuer Ventil 1.
  triggers:
  - entity_id: valve.garten_gardena_ventil_1
    from: 'closed'
    to: 'open'
    trigger: state
  - entity_id: valve.garten_gardena_ventil_1
    from: 'open'
    to: 'closed'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state == 'open' }}"
      sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.gardena_ventil_1_last_start
        data:
          value: "{{ now().strftime('%d.%m.%Y %H:%M') }}"
    - conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state == 'closed' }}"
      sequence:
      - variables:
          started_raw: "{{ states('input_text.gardena_ventil_1_last_start') }}"
          started_ts: "{{ as_timestamp(strptime(started_raw, '%d.%m.%Y %H:%M'), 0) if started_raw not in ['unknown','unavailable','',None] else 0 }}"
          duration_min: "{{ ((as_timestamp(now()) - started_ts) / 60) | round(0) if started_ts > 0 else 0 }}"
          history_old: "{{ states('input_text.gardena_ventil_1_history') }}"
          new_entry: "{{ now().strftime('%d.%m %H:%M') }} ({{ duration_min | int }} min)"
      - service: input_text.set_value
        target:
          entity_id: input_text.gardena_ventil_1_last_stop
        data:
          value: "{{ now().strftime('%d.%m.%Y %H:%M') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.gardena_ventil_1_last_duration
        data:
          value: "{{ duration_min | int }} min"
      - service: input_text.set_value
        target:
          entity_id: input_text.gardena_ventil_1_history
        data:
          value: >
            {% set old = history_old if history_old not in ['unknown','unavailable','',None] else '' %}
            {% if old | length > 0 %}
              {{ (new_entry ~ ' | ' ~ old)[:255] }}
            {% else %}
              {{ new_entry[:255] }}
            {% endif %}
  mode: queued

