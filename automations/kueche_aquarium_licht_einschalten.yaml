# ++
# ++ Küche Aquarium Licht - Einschalten
# ++
# Schaltet die Aquarium-Beleuchtung zur geplanten Zeit ein, wenn der Timer aktiv ist.
# Funktioniert nur, wenn der Timer aktiv und der manuelle Modus deaktiviert ist.
# Loggt die Aktion ins System Log.
# ++

- id: 'kueche_aquarium_licht_einschalten'
  alias: Kueche_Aquarium_Licht_Einschalten
  description: Schaltet Aquarium Licht zeitgesteuert ein
  triggers:
  - at: input_datetime.kueche_aquarium_licht_on
    trigger: time
  conditions:
  - condition: state
    entity_id: input_boolean.kueche_aquarium_timer_active
    state: 'on'
  actions:
  - variables:
      target_entity: switch.0xa4c13879004064c6
      target_state: 'on'
  - repeat:
      count: 3
      sequence:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ target_entity }}'
      - delay: '00:00:01'
  - if:
    - condition: template
      value_template: "{{ not is_state(target_entity, target_state) }}"
    then:
    - data:
        message: '[Aquarium] Licht konnte nach 3 Versuchen nicht eingeschaltet werden. Zustand: {{ states(target_entity) }}'
        level: warning
      service: system_log.write
    else:
    - data:
        message: '[Aquarium] Licht eingeschaltet um {{ now().strftime(''%H:%M'') }}'
        level: info
      service: system_log.write
  mode: single