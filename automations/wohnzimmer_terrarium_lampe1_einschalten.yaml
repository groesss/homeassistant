# ++
# ++ Terrarium Lampe 1 (Bright Sun) - Einschalten
# ++
# Schaltet die Bright Sun Lampe zur geplanten Zeit ein, wenn der Timer aktiv ist.
# Die Einschaltzeit wird durch den Warmup/Cooldown-Zyklus dynamisch angepasst.
# Loggt die Aktion ins System Log.
# ++

- id: '1760956184095'
  alias: Wohnzimmer_Terrarium_Lampe1_Einschalten
  description: Schaltet Bright Sun Lampe zeitgesteuert ein
  triggers:
  - at: input_datetime.wohnzimmer_terrarium_lampe1_on
    trigger: time
  conditions:
  - condition: state
    entity_id: input_boolean.wohnzimmer_terrarium_timer_active
    state: 'on'
  actions:
  - target:
      entity_id: switch.wohnzimmer_terrarium_steckdose_1
    service: switch.turn_on
  - data:
      message: '[Terrarium] Lampe ''Bright Sun'' eingeschaltet um {{ now().strftime(''%H:%M'')
        }}'
      level: info
    service: system_log.write
  mode: single
