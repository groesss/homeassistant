# ++
# ++ Terrarium Timer Guard (Sicherheitsabschaltung)
# ++
# Sicherheitsfunktion: Schaltet alle Terrarium-Lampen sofort aus, wenn der Timer
# deaktiviert wird. Verhindert, dass Lampen versehentlich dauerhaft eingeschaltet bleiben.
# Wichtig für Brandschutz und Energiesparen.
# ++

- id: '1769945515058'
  alias: Wohnzimmer_Terrarium_Timer_Guard
  description: Schaltet alle Lampen sofort aus bei Timer-Deaktivierung
  triggers:
  - entity_id: input_boolean.wohnzimmer_terrarium_timer_active
    to: 'off'
    trigger: state
  actions:
  - target:
      entity_id:
      - switch.wohnzimmer_smartplug_terrarium_1
      - switch.wohnzimmer_smartplug_terrarium_2
    action: switch.turn_off
  - data:
      message: '[Timer Guard] Timer deaktiviert – Lampen ausgeschaltet'
      level: info
    action: system_log.write
  mode: single
