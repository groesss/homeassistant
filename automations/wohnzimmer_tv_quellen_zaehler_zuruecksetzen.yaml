# ++
# ++ Tägliches Reset der TV-Statistiken
# ++
# Setzt täglich um Mitternacht alle TV-Zähler auf 0 zurück:
# - Alle Quellen-Zähler (Netflix, YouTube, Prime, Disney+, Plex, HDMI, TV, Andere)
# - Gesamtnutzungsdauer-Counter
# Ermöglicht tägliche Auswertung der TV-Nutzung.
# ++

- id: '1753082518657'
  alias: Wohnzimmer_TV_Quellen_Zähler_zurücksetzen
  description: Setzt täglich um Mitternacht alle TV-Zähler zurück
  triggers:
  - at: 00:00:00
    trigger: time
  actions:
  - data:
      entity_id: input_number.wohnzimmer_tv_minute_count_hdmi
      value: 0
    service: input_number.set_value
  - data:
      entity_id: input_number.wohnzimmer_tv_minute_count_netflix
      value: 0
    service: input_number.set_value
  - data:
      entity_id: input_number.wohnzimmer_tv_minute_count_prime
      value: 0
    service: input_number.set_value
  - data:
      entity_id: input_number.wohnzimmer_tv_minute_count_youtube
      value: 0
    service: input_number.set_value
  - data:
      entity_id: input_number.wohnzimmer_tv_minute_count_disney
      value: 0
    service: input_number.set_value
  - data:
      entity_id: input_number.wohnzimmer_tv_minute_count_plex
      value: 0
    service: input_number.set_value
  - data:
      entity_id: input_number.wohnzimmer_tv_minute_count_tv
      value: 0
    service: input_number.set_value
  - data:
      entity_id: input_number.wohnzimmer_tv_minute_count_andere
      value: 0
    service: input_number.set_value
  - data:
      entity_id: counter.wohnzimmer_tv_watch_minutes
    service: counter.reset

