
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

lovelace:
  mode: yaml
  resource_mode: yaml
  resources:
    - url: /hacsfiles/lovelace-mushroom/mushroom.js?hacstag=4443503755010
      type: module
    - url: /hacsfiles/timer-bar-card/timer-bar-card.js?hacstag=3769045171311
      type: module
    - url: /hacsfiles/vertical-stack-in-card/vertical-stack-in-card.js?hacstag=142051833101
      type: module
    - url: /hacsfiles/button-card/button-card.js?hacstag=146194325701
      type: module
    - url: /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524410
      type: module
    - url: /hacsfiles/lovelace-fold-entity-row/fold-entity-row.js
      type: module
    - url: /hacsfiles/lovelace-hui-element/hui-element.js?hacstag=249942054180547
      type: module
    - url: /hacsfiles/numberbox-card/numberbox-card.js?hacstag=304967918417
      type: module
    - url: /hacsfiles/lovelace-auto-entities/auto-entities.js?hacstag=1677445841161
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js?hacstag=1512800620130
      type: module
    - url: /hacsfiles/restriction-card/restriction-card.js?hacstag=2156334041219
      type: module
    - url: /hacsfiles/stack-in-card/stack-in-card.js?hacstag=248954055020
      type: module
    - url: /hacsfiles/lovelace-time-picker-card/time-picker-card.js?hacstag=261262884140
      type: module
    - url: /local/community/decluttering-card/decluttering-card.js
      type: module

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include_dir_merge_list templates/
input_number: !include_dir_merge_named helpers/input_number
input_boolean: !include_dir_merge_named helpers/input_boolean 
input_datetime: !include_dir_merge_named helpers/input_datetime
input_select: !include_dir_merge_named helpers/input_select
utility_meter: !include helpers/utility_meter.yaml
recorder: !include recorder.yaml
