
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  resources:
    - url: /local/community/lovelace-mushroom/mushroom.js
      type: module
    - url: /local/community/timer-bar-card/timer-bar-card.js
      type: module
    - url: /local/community/vertical-stack-in-card/vertical-stack-in-card.js
      type: module
    - url: /local/community/button-card/button-card.js
      type: module
    - url: /local/community/lovelace-card-mod/card-mod.js
      type: module
    - url: /local/community/lovelace-fold-entity-row/fold-entity-row.js
      type: module
    - url: /local/community/lovelace-hui-element/hui-element.js
      type: module
    - url: /local/community/numberbox-card/numberbox-card.js
      type: module
    - url: /local/community/lovelace-auto-entities/auto-entities.js
      type: module
    - url: /local/community/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /local/community/restriction-card/restriction-card.js
      type: module
    - url: /local/community/stack-in-card/stack-in-card.js
      type: module
    - url: /local/community/lovelace-time-picker-card/time-picker-card.js
      type: module
    - url: /local/community/decluttering-card/decluttering-card.js
      type: module
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true    

automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include_dir_merge_list templates/
input_number: !include_dir_merge_named helpers/input_number
input_boolean: !include_dir_merge_named helpers/input_boolean
input_datetime: !include_dir_merge_named helpers/input_datetime
input_select: !include_dir_merge_named helpers/input_select
utility_meter: !include helpers/utility_meter.yaml
recorder: !include recorder.yaml
