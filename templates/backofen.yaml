
# Datei: templates/backofen.yaml
# Beschreibung:
# Diese Datei enthält Template-Sensoren für den Backofen in der Küche.
# Sie liefern den aktuellen Status (z.B. Läuft, Fertig, Ausgeschaltet) und das aktive Programm (z.B. Heißluft, Ober-/Unterhitze) als Text.
# Die Sensoren reagieren auf Status- und Türsensoren sowie das aktive Programm und sind für die Anzeige im Dashboard und für Benachrichtigungen optimiert.
#
# Namenskonvention: Alle unique_ids und Namen folgen dem Muster <raum>_<gerät>_<attribut>.
# Konsistenz: Die Logik und Statusabbildung ist identisch zu den Templates für Geschirrspüler und Trockner.
#
# Änderungen an der Statuslogik oder Programmliste sollten immer synchron in allen Geräte-Templates erfolgen.

- trigger:
    - platform: state
      entity_id:
        - sensor.kueche_backofen_status_operationstate
        - binary_sensor.kueche_backofen_status_doorstate
        - sensor.kueche_backofen_active_program
        - sensor.kueche_backofen_option_remainingprogramtime
        - sensor.kueche_backofen_option_programprogress
        - sensor.kueche_backofen_status_currentcavitytemperature
        - sensor.kueche_backofen_option_setpointtemperature
    - platform: time_pattern
      minutes: "/1"

  sensor:
    # Stable alias layer: use these entities in UI/automations.
    # If raw integration IDs change, only this file needs updates.
    - name: "Kueche Backofen Raw Operationstate"
      unique_id: kueche_backofen_raw_operationstate
      state: >-
        {% set invalid = ['unknown', 'unavailable', 'none', 'None', ''] %}
        {% set old_id = 'sensor.kueche_backofen_status_operationstate' %}
        {% set ns = namespace(prog='') %}
        {% for s in states.sensor %}
          {% if ns.prog == '' and s.entity_id.startswith('sensor.bosch_') and '_cooking_oven_' in s.entity_id and s.entity_id.endswith('_active_program') %}
            {% set ns.prog = s.entity_id %}
          {% endif %}
        {% endfor %}
        {% set base = ns.prog.split('_cooking_oven_')[0].replace('sensor.', '') if ns.prog else '' %}
        {% set dyn_id = 'sensor.' ~ base ~ '_bsh_common_status_operationstate' if base else '' %}
        {% set vals = [states(old_id), states(dyn_id) if dyn_id else 'unknown'] | reject('in', invalid) | list %}
        {{ vals[0] if vals | length > 0 else 'unknown' }}

