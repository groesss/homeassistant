
# Datei: templates/backofen.yaml
# Beschreibung:
# Diese Datei enthält Template-Sensoren für den Backofen in der Küche.
# Sie liefern den aktuellen Status (z.B. Läuft, Fertig, Ausgeschaltet) und das aktive Programm (z.B. Heißluft, Ober-/Unterhitze) als Text.
# Die Sensoren reagieren auf Status- und Türsensoren sowie das aktive Programm und sind für die Anzeige im Dashboard und für Benachrichtigungen optimiert.
#
# Namenskonvention: Alle unique_ids und Namen folgen dem Muster <raum>_<gerät>_<attribut>.
# Konsistenz: Die Logik und Statusabbildung ist identisch zu den Templates für Geschirrspüler und Trockner.
#
# Änderungen an der Statuslogik oder Programmliste sollten immer synchron in allen Geräte-Templates erfolgen.

- trigger:
    - platform: state
      entity_id:
        - sensor.kueche_backofen_status_operationstate
        - binary_sensor.kueche_backofen_status_doorstate
        - sensor.kueche_backofen_active_program

  sensor:
    - name: "Kueche Backofen Status Text"
      unique_id: kueche_backofen_status_text
      state: >-
        {% set op = states('sensor.kueche_backofen_status_operationstate') %}
        {% set door = states('binary_sensor.kueche_backofen_status_doorstate') %}
        {% set old = this.state if this.state not in ['unknown','unavailable',''] else 'Bereit' %}

        {% if op == 'BSH.Common.EnumType.OperationState.Run' %}
          Läuft
        {% elif op == 'BSH.Common.EnumType.OperationState.Pause' %}
          Pausiert
        {% elif op == 'BSH.Common.EnumType.OperationState.Ready' %}
          {% if old == 'Fertig' and door == 'off' %}
            Fertig
          {% else %}
            Bereit
          {% endif %}
        {% elif op == 'BSH.Common.EnumType.OperationState.Finished' %}
          Fertig
        {% elif op == 'BSH.Common.EnumType.OperationState.Stopped' %}
          Gestoppt
        {% elif op == 'BSH.Common.EnumType.OperationState.Inactive' %}
          {% if old == 'Fertig' and door == 'off' %}
            Fertig
          {% else %}
            Ausgeschaltet
          {% endif %}
        {% else %}
          {{ op }}
        {% endif %}

    - name: "Kueche Backofen Aktives Programm Text"
      unique_id: kueche_backofen_aktives_programm_text
      state: >-
        {% set op = states('sensor.kueche_backofen_active_program') %}
        {% set program_map = {
          'Cooking.Oven.Program.HeatingMode.HotAir': 'Heißluft',
          'Cooking.Oven.Program.HeatingMode.TopBottomHeating': 'Ober-/Unterhitze',
          'Cooking.Oven.Program.HeatingMode.HotAirGentle': 'Sanfte Heißluft',
          'Cooking.Oven.Program.HeatingMode.TopBottomHeatingEco': 'Sanfte Ober-/Unterhitze',
          'Cooking.Oven.Program.HeatingMode.AirFry': 'AirFry',
          'Cooking.Oven.Program.HeatingMode.HotAirGrilling': 'Heißluftgrill',
          'Cooking.Oven.Program.HeatingMode.GrillLargeArea': 'Grill (Großfläche)',
          'Cooking.Oven.Program.HeatingMode.GrillSmallArea': 'Grill (Kleinfläche)',
          'Cooking.Oven.Program.HeatingMode.PizzaSetting': 'Pizzastufe',
          'Cooking.Oven.Program.HeatingMode.SlowCook': 'Langsamgaren',
          'Cooking.Oven.Program.HeatingMode.Defrost': 'Auftauen',
          'Cooking.Oven.Program.HeatingMode.BottomHeating': 'Unterhitze',
          'Cooking.Oven.Program.HeatingMode.KeepWarm': 'Warmhalten',
          'Cooking.Oven.Program.HeatingMode.PreheatOvenware': 'Geschirr vorwärmen',
          'Cooking.Oven.Program.SubsequentMode.ContinueCooking': 'Programm verlängert'
        } %}

        {% if op in ['unknown', 'unavailable', '', None] %}
          –
        {% else %}
          {{ program_map.get(op, op) }}
        {% endif %}

