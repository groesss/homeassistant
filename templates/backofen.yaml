        {% endfor %}
        {% set base = ns.prog.split('_cooking_oven_')[0].replace('sensor.', '') if ns.prog else '' %}
        {% set dyn_id = 'binary_sensor.' ~ base ~ '_bsh_common_status_doorstate' if base else '' %}
        {% set vals = [states(old_id), states(dyn_id) if dyn_id else 'unknown'] | reject('in', invalid) | list %}
        {{ vals[0] if vals | length > 0 else 'unknown' }}

