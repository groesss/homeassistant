          {{ '|sensor.solar_slave_fehler_message|' in store }}
        message: >
          {% set st = states('sensor.ps_8_0_18fc_rct_power_storage_slave_faults') %}
          {% set faults = state_attr('sensor.ps_8_0_18fc_rct_power_storage_slave_faults', 'active_faults') | default([], true) %}
          {% if faults | length > 0 %}
            Der RCT Slave-Wechselrichter meldet folgende Fehler: {{ faults | join(', ') }}.
          {% elif st not in ['0', '0000', 'unknown', 'unavailable', 'none', 'None', ''] %}
            Der RCT Slave-Wechselrichter meldet den Fehlerstatus: {{ st }}.
          {% else %}
            Der RCT Slave-Wechselrichter meldet einen unbekannten Fehler.
          {% endif %}
        message_type: "error"

    - name: "Solar CAN Timeout Message"
      unique_id: solar_can_timeout_message
      state: >
        {% set mst = states('sensor.ps_10_0_hc2g_rct_power_storage_faults') %}
        {% set sst = states('sensor.ps_8_0_18fc_rct_power_storage_slave_faults') %}
        {% set mf = state_attr('sensor.ps_10_0_hc2g_rct_power_storage_faults', 'active_faults') | default([], true) %}
        {% set sf = state_attr('sensor.ps_8_0_18fc_rct_power_storage_slave_faults', 'active_faults') | default([], true) %}
        {% set allf = (mf + sf) | join(', ') %}
        {{ 'CAN_TIMEOUT' in allf or 'CAN_TIMEOUT' in mst or 'CAN_TIMEOUT' in sst }}
      icon: mdi:lan-disconnect
      attributes:
        message_title: "Solar CAN Timeout erkannt"
        message_ack_enabled: true
        message_ack_key: "sensor.solar_can_timeout_message"
        is_acknowledged: >
          {% set store = states('input_text.messages_acknowledged') %}
          {{ '|sensor.solar_can_timeout_message|' in store }}
        message: >
          {% set mst = states('sensor.ps_10_0_hc2g_rct_power_storage_faults') %}
          {% set sst = states('sensor.ps_8_0_18fc_rct_power_storage_slave_faults') %}
          {% set mf = state_attr('sensor.ps_10_0_hc2g_rct_power_storage_faults', 'active_faults') | default([], true) %}
          {% set sf = state_attr('sensor.ps_8_0_18fc_rct_power_storage_slave_faults', 'active_faults') | default([], true) %}
          CAN_TIMEOUT erkannt. Das deutet auf ein Kommunikationsproblem im Batterie/CAN-Pfad hin.
          Master: {% if mf | length > 0 %}{{ mf | join(', ') }}{% else %}{{ mst }}{% endif %}.
          Slave: {% if sf | length > 0 %}{{ sf | join(', ') }}{% else %}{{ sst }}{% endif %}.
          Bitte pruefe CAN-Verkabelung, Batterie-Kommunikation und RCT-Integration.
        message_type: "error"

- sensor:
    - name: "Messages Acknowledged Errors Active Count"
      unique_id: messages_acknowledged_errors_active_count
      state: >
        {% set ns = namespace(c=0) %}
        {% for s in states.sensor if s.entity_id.endswith('_message') and s.state == 'True' %}
          {% set is_error = s.attributes.message_type == 'error' %}
          {% set ack_enabled = (s.attributes.message_ack_enabled | string | lower) in ['true', '1', 'on', 'yes'] %}
          {% set is_ack = (s.attributes.is_acknowledged | string | lower) in ['true', '1', 'on', 'yes'] %}
          {% if is_error and ack_enabled and is_ack %}
            {% set ns.c = ns.c + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.c }}
      icon: mdi:counter

- binary_sensor:
    - name: "Messages Has Acknowledged Errors Active"
      unique_id: messages_has_acknowledged_errors_active
      state: "{{ states('sensor.messages_acknowledged_errors_active_count') | int(0) > 0 }}"
      icon: mdi:alert-circle-check