      icon: mdi:water-opacity
      attributes:
        message_title: "Überflutungs-Sensor Ölkeller angeschlagen"
        message: "Achtung: Der Flutsensor hat Wasser erkannt. Das Hauswasserwerk verliert Wasser! Bitte überprüfe, ob der Ölkeller überschwemmt ist!"
        message_type: "warning"
   
    - name: "Oelkeller Flutsensor Batterie Message"
      unique_id: oelkeller_flutsensor_batterie_message
      state: >
        {% set battery = states('sensor.oelkeller_flutsensor_battery') %}
        {{ battery not in ['unknown', 'unavailable', 'none', 'None', ''] and battery | float(101) < 20 }}
      icon: mdi:battery
      attributes:
        message_title: "Überflutungs-Sensor Batterie gering"
        message: >
          {% set battery = states('sensor.oelkeller_flutsensor_battery') %}
          Die Batterie des Oelkeller Flutsensors beträgt nur noch
          {{ battery if battery not in ['unknown', 'unavailable', 'none', 'None', ''] else '?' }} %.
          Bitte tausche sie zeitnah aus, damit der Sensor weiterhin funktioniert.
        message_type: "info"

