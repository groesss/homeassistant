
# Datei: templates/messages.yaml
# Beschreibung:
# Diese Datei enthält zentrale Template-Sensoren für alle System- und Gerätemeldungen (z.B. Fertig-Meldungen, Warnungen, Batteriehinweise).
# Jeder Sensor liefert einen state (true/false), einen Titel, eine Nachricht und einen Typ (info, warning, error) als Attribute.
# Die Sensoren werden im Dashboard und für Benachrichtigungen verwendet.
#
# Namenskonvention: unique_id und Name folgen dem Muster <raum>_<gerät>_<attribut>_message.
# Konsistenz: Die Logik ist auf die zugehörigen Geräte-Templates und Automatisierungen abgestimmt.
#
# Änderungen an den Meldungsbedingungen oder Texten sollten immer mit den zugehörigen Automatisierungen und UI-Elementen abgestimmt werden.

- sensor:
    - name: "Kueche Geschirrspueler Message"
      unique_id: kueche_geschirrspueler_message
      state: "{{ states('sensor.kueche_geschirrspueler_status_text') == 'Fertig' }}"
      icon: mdi:dishwasher
      attributes:
        message_title: "Geschirrspüler Fertig"
        message: "Der Geschirrspüler ist fertig und kann ausgeräumt werden!"
        message_type: "info"

    - name: "Kueche Backofen Message"
      unique_id: kueche_backofen_message
      state: "{{ states('sensor.kueche_backofen_status_text') in ['Fertig','Abkühlen'] }}"
      icon: mdi:stove
      attributes:
        message_title: "Backofen Fertig"
        message: "Der Backofen hat sein Programm beendet!"
        message_type: "info"

    - name: "Waschkeller Waschmaschine Links Message"
      unique_id: waschkeller_waschmaschine_links_message
      state: "{{ states('sensor.waschkeller_waschmaschine_links_status') == 'Fertig' }}"
      icon: mdi:washing-machine
      attributes:
        message_title: "Waschmaschine Links fertig"
        message: >
          {% set phase = state_attr('sensor.waschkeller_waschmaschine_links_status', 'phase') %}
          {% set programm = state_attr('sensor.waschkeller_waschmaschine_links_status', 'programm') %}
          {% set dauer = state_attr('sensor.waschkeller_waschmaschine_links_status', 'gesamtdauer') %}
          {% set energie = state_attr('sensor.waschkeller_waschmaschine_links_status', 'energie') %}
          Die Waschmaschine links
          {%- if programm and programm not in ['unknown', 'unavailable', 'none', ''] %} - {{ programm }}{% endif -%}
          {%- if phase and phase != 'unknown' and phase not in ['Fertig', 'finished', 'clean', 'ending'] %} ({{ phase }}){% endif -%}
          ist fertig.
          {%- if dauer and dauer not in ['unknown', 'unavailable', 'none', ''] %} (Dauer {{ dauer }}){% endif -%}.
          Sie kann nun ausgeräumt werden!
        message_type: "info"

    - name: "Waschkeller Waschmaschine Rechts Message"
      unique_id: waschkeller_waschmaschine_rechts_message
      state: "{{ states('sensor.waschkeller_waschmaschine_rechts_status') == 'Fertig' }}"
      icon: mdi:washing-machine
      attributes:
        message_title: "Waschmaschine Rechts fertig"
        message: >
          {% set phase = state_attr('sensor.waschkeller_waschmaschine_rechts_status', 'phase') %}
          {% set programm = state_attr('sensor.waschkeller_waschmaschine_rechts_status', 'programm') %}
          {% set dauer = state_attr('sensor.waschkeller_waschmaschine_rechts_status', 'gesamtdauer') %}
          {% set energie = state_attr('sensor.waschkeller_waschmaschine_rechts_status', 'energie') %}
          Die Waschmaschine rechts
          {%- if programm and programm not in ['unknown', 'unavailable', 'none', ''] %} - {{ programm }}{% endif -%}
          {%- if phase and phase != 'unknown' and phase not in ['Fertig', 'finished', 'clean', 'ending'] %} ({{ phase }}){% endif -%}
          ist fertig.
          {%- if dauer and dauer not in ['unknown', 'unavailable', 'none', ''] %} (Dauer {{ dauer }}){% endif -%}.
          Sie kann nun ausgeräumt werden!
        message_type: "info"

    - name: "Waschkeller Trockner Message"
      unique_id: waschkeller_trockner_message
      state: "{{ states('sensor.waschkeller_trockner_status_text') == 'Fertig' }}"
      icon: mdi:tumble-dryer
      attributes:
