    - name: "Solar Wechselrichter Kommunikation Message"
      unique_id: solar_wechselrichter_kommunikation_message
      state: >
        {% set value = states('sensor.ps_10_0_hc2g_rct_power_storage_inverter_serial_number') %}
        {% set entity = states.sensor.ps_10_0_hc2g_rct_power_storage_inverter_serial_number %}
        {{
          value in ['unknown', 'unavailable', 'none', 'None', '']
          and entity is not none
          and (as_timestamp(now()) - as_timestamp(entity.last_changed, 0)) > 3600
        }}
      icon: mdi:solar-power-variant-outline
      attributes:
        message_title: "Solaranlage nicht erreichbar"
        message: >
          Der RCT Wechselrichter liefert seit mehr als 60 Minuten keine Daten mehr.
          Bitte prüfe Home Assistant, die RCT Integration sowie die Netzwerkverbindung zum Wechselrichter.
        message_type: "warning"

    - name: "Solar Batterie Kommunikation Message"
      unique_id: solar_batterie_kommunikation_message
      state: >
        {% set value = states('sensor.battery_at_ps_10_0_hc2g_rct_power_storage_battery_state_of_charge') %}
        {% set entity = states.sensor.battery_at_ps_10_0_hc2g_rct_power_storage_battery_state_of_charge %}
        {{
          value in ['unknown', 'unavailable', 'none', 'None', '']
          and entity is not none
          and (as_timestamp(now()) - as_timestamp(entity.last_changed, 0)) > 21600
        }}
      icon: mdi:battery-alert-variant-outline
      attributes:
        message_title: "Solar-Batterie nicht erreichbar"
        message: >
          Die RCT Batterie beziehungsweise deren Statusdaten sind seit mehr als 6 Stunden nicht erreichbar.
          Bitte prüfe Batterie, Verkabelung und die Datenbereitstellung der RCT Integration.
        message_type: "warning"

    - name: "Solar Wechselrichter Fehler Message"
      unique_id: solar_wechselrichter_fehler_message
      state: >
        {% set st = states('sensor.ps_10_0_hc2g_rct_power_storage_faults') %}
        {% set cnt = state_attr('sensor.ps_10_0_hc2g_rct_power_storage_faults', 'active_fault_count') | int(0) %}
        {% set faults = state_attr('sensor.ps_10_0_hc2g_rct_power_storage_faults', 'active_faults') | default([], true) %}
        {{ cnt > 0 or (faults | length > 0) or st not in ['0', '0000', 'unknown', 'unavailable', 'none', 'None', ''] }}
      icon: mdi:alert-circle-outline
      attributes:
        message_title: "Solaranlage meldet Fehler"
        message_ack_enabled: true
        message_ack_key: "sensor.solar_wechselrichter_fehler_message"
        is_acknowledged: >
          {% set store = states('input_text.messages_acknowledged') %}
          {{ '|sensor.solar_wechselrichter_fehler_message|' in store }}
        message: >
          {% set st = states('sensor.ps_10_0_hc2g_rct_power_storage_faults') %}
          {% set faults = state_attr('sensor.ps_10_0_hc2g_rct_power_storage_faults', 'active_faults') | default([], true) %}
          {% if faults | length > 0 %}
            Der RCT Wechselrichter meldet folgende Fehler: {{ faults | join(', ') }}.
          {% elif st not in ['0', '0000', 'unknown', 'unavailable', 'none', 'None', ''] %}
            Der RCT Wechselrichter meldet den Fehlerstatus: {{ st }}.
          {% else %}
            Der RCT Wechselrichter meldet einen unbekannten Fehler.
          {% endif %}
        message_type: "error"

    - name: "Solar Slave Fehler Message"
      unique_id: solar_slave_fehler_message
      state: >
        {% set st = states('sensor.ps_8_0_18fc_rct_power_storage_slave_faults') %}
        {% set cnt = state_attr('sensor.ps_8_0_18fc_rct_power_storage_slave_faults', 'active_fault_count') | int(0) %}
        {% set faults = state_attr('sensor.ps_8_0_18fc_rct_power_storage_slave_faults', 'active_faults') | default([], true) %}
