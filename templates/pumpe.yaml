# Datei: templates/pumpe.yaml
# Beschreibung:
# Status-Template fuer die Gartenpumpe (ANTELA Smart Steckdose).
# Die Pumpe ist eine Notpumpe bei Hochwasser, nur 2-3x/Jahr aktiv.
#
# Sensoren:
# - binary_sensor.pumpe_laeuft: on/off basierend auf Power > 5W
# - sensor.pumpe_last_on: Timestamp des letzten Einschaltens
# - sensor.pumpe_last_off: Timestamp des letzten Ausschaltens
# - sensor.pumpe_message: Boolean fuer Notification (True wenn Pumpe gerade laeuft)

- binary_sensor:
    - name: "Pumpe läuft"
      unique_id: "garten_pumpe_lauft"
      device_class: power
      state: >
        {{ states('sensor.garten_smartplug_pumpe_power') | float(0) > 5 }}
      availability: >
        {{ states('sensor.garten_smartplug_pumpe_power') not in ['unknown', 'unavailable', 'None'] }}

- sensor:
    - name: "Pumpe zuletzt eingeschaltet"
      unique_id: "garten_pumpe_last_on"
      icon: mdi:clock-outline
      state: >
        {% if is_state('binary_sensor.pumpe_laeuft', 'on') %}
          {{ now().strftime('%d.%m.%Y %H:%M') }}
        {% else %}
          {{ this.state if this.state not in ['unknown', 'unavailable', ''] else 'Noch nie' }}
        {% endif %}

    - name: "Pumpe zuletzt ausgeschaltet"
      unique_id: "garten_pumpe_last_off"
      icon: mdi:clock-outline
      state: >
        {% if is_state('binary_sensor.pumpe_laeuft', 'off') and this.state not in ['unknown', 'unavailable', ''] %}
          {{ this.state }}
        {% elif is_state('binary_sensor.pumpe_laeuft', 'off') %}
          {{ now().strftime('%d.%m.%Y %H:%M') }}
        {% else %}
          {{ this.state if this.state not in ['unknown', 'unavailable', ''] else 'Noch nie' }}
        {% endif %}

    - name: "Pumpe Message"
      unique_id: "garten_pumpe_message"
      icon: mdi:alert-circle-outline
      state: "{{ is_state('binary_sensor.pumpe_laeuft', 'on') }}"
      attributes:
        message_title: "Grundwasserpumpe aktiv!"
        message: "Die Pumpe im Grundwasserschacht laeuft. Bitte ueberpruefe den Wasserstand!"
        message_type: "warning"
