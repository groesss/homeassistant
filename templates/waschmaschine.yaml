        gesamtdauer: "{{ states('sensor.waschmaschine_rechts_gesamtdauer') }}"
        energie: "{{ states('sensor.waschmaschine_rechts_energie_gesamt') }}"
        programm: "{{ states('sensor.waschmaschine_rechts_programm') }}"
