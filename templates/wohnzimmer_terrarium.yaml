# Datei: templates/wohnzimmer_terrarium.yaml
# Template-Sensor für Warmup & Cooldown mit automatischer Aktualisierung

- sensor:
    - name: "Wohnzimmer Terrarium Warmup/Cooldown Info"
      unique_id: wohnzimmer_terrarium_warmup_cooldown_info
      state: >
        {% set lampe1_on = states('input_datetime.wohnzimmer_terrarium_lampe1_on') %}
        {% set lampe1_off = states('input_datetime.wohnzimmer_terrarium_lampe1_off') %}
        {% if lampe1_on not in ['unknown','unavailable',''] and lampe1_off not in ['unknown','unavailable',''] %}
          {% set fmt = '%H:%M:%S' %}
          {% set lampe1_on_dt = strptime(lampe1_on, fmt) %}
          {% set lampe1_off_dt = strptime(lampe1_off, fmt) %}
          {{ ((lampe1_off_dt - lampe1_on_dt).seconds / 3600) | round(1) }}
        {% else %}
          unavailable
        {% endif %}
      attributes:
        message: |
          {% set step_hours = 1 %}
          {% set max_hours = states('input_number.wohnzimmer_terrarium_max_time') | float(0) %}

          {% set lampe1_on = states('input_datetime.wohnzimmer_terrarium_lampe1_on') %}
          {% set lampe1_off = states('input_datetime.wohnzimmer_terrarium_lampe1_off') %}
          {% set lampe2_on = states('input_datetime.wohnzimmer_terrarium_lampe2_on') %}
          {% set lampe2_off = states('input_datetime.wohnzimmer_terrarium_lampe2_off') %}

          {% set warmup = is_state('input_boolean.wohnzimmer_terrarium_warmup_active','on') %}
          {% set cooldown = is_state('input_boolean.wohnzimmer_terrarium_cooldown_active','on') %}
          {% set timer_active = is_state('input_boolean.wohnzimmer_terrarium_timer_active','on') %}

          {% if lampe1_on not in ['unknown','unavailable',''] and lampe1_off not in ['unknown','unavailable',''] %}
            {% set fmt = '%H:%M:%S' %}
            {% set lampe1_on_dt = strptime(lampe1_on, fmt) %}
            {% set lampe1_off_dt = strptime(lampe1_off, fmt) %}
            {% set duration = ((lampe1_off_dt - lampe1_on_dt).seconds / 3600) | round(1) %}
            {% set overlap_raw = duration - 0.5 %}
            {% set overlap = (overlap_raw if overlap_raw > 0 else 0) | round(1) %}

            {# --- Terrarium Betrieb aus --- #}
            {% if not timer_active %}
              **Terrarium Betrieb aus:**  
              Zeitschaltuhren sind deaktiviert.  
              Aktuelle Beleuchtungsdauer (Lampe 1): **{{ duration }} h**  
              Gemeinsame Beleuchtung: **{{ overlap }} h**

            {# --- Warmup aktiv --- #}
            {% elif warmup %}
              {% set target = max_hours %}
              {% set days_raw = (max_hours - duration) %}
              {% set days = (days_raw if days_raw > 0 else 0) | round(0) %}
              {% set start_date = now().strftime('%d.%m.%Y') %}
              {% set end_date = (now() + timedelta(days=days)).strftime('%d.%m.%Y') %}
              **Warmup aktiv:**  
              Die Beleuchtungszeit wird **jeden Tag um +{{ step_hours }} h** erhoeht.  
              Ziel: {{ target }} h (Lampe 1)  
              Zeitraum: {{ start_date }} bis {{ end_date }}  
              (**noch {{ days }} Tage**)  
              Aktuelle Beleuchtungsdauer (Lampe 1): **{{ duration }} h**  
              Gemeinsame Beleuchtung: **{{ overlap }} h**

            {# --- Cooldown aktiv --- #}
            {% elif cooldown %}
              {% set target = 0 %}
              {% set days = duration | round(0) %}
              {% set start_date = now().strftime('%d.%m.%Y') %}
              {% set end_date = (now() + timedelta(days=days)).strftime('%d.%m.%Y') %}
              **Cooldown aktiv:**  
              Die Beleuchtungszeit wird **jeden Tag um -{{ step_hours }} h** reduziert.  
              Ziel: {{ target }} h (Lampe 1)  
              Zeitraum: {{ start_date }} bis {{ end_date }}  
              (**noch {{ days }} Tage**)  
              Aktuelle Beleuchtungsdauer (Lampe 1): **{{ duration }} h**  
              Gemeinsame Beleuchtung: **{{ overlap }} h**

            {# --- Warmup abgeschlossen --- #}
            {% elif duration >= max_hours %}
              🔔 **Warmup gestoppt: Maximaldauer erreicht.**  
              Aktuelle Beleuchtungsdauer (Lampe 1): **{{ duration }} h**  
              Gemeinsame Beleuchtung: **{{ overlap }} h**

            {# --- Cooldown abgeschlossen / Winterschlaf --- #}
            {% elif duration <= 0 %}
              ❄️ **Cooldown abgeschlossen: Winterschlaf erreicht!**  
              Aktuelle Beleuchtungsdauer (Lampe 1): **{{ duration }} h**

            {# --- Normalbetrieb --- #}
            {% else %}
              Normaler Betrieb (Zeitschaltuhren aktiv).  
              Lampe 1 laeuft **{{ duration }} h pro Tag**.  
              Lampe 2 startet 30 min spaeter und endet 30 min spaeter.  
              Gemeinsame Beleuchtung: **{{ overlap }} h**
            {% endif %}

          {% else %}
            Keine Zeitwerte gesetzt.
          {% endif %}
