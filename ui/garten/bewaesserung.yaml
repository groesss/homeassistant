type: grid
cards:
  - type: heading
    icon: mdi:watering-can-outline
    heading: Bewässerung
    heading_style: title
  - type: vertical-stack
    cards:
      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/ui/shared/styles/stack_wrapper.yaml # Stack Wrapper Style
        cards:
          - type: entities
            card_mod: !include /config/ui/shared/styles/entities_flat.yaml # Entities Flat Style
            entities:
              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  primary: Gardena Ventil 1
                  secondary: >
                    {% set batt = states('sensor.garten_gardena_ventil_1_battery') %}
                    {% set state = states('valve.garten_gardena_ventil_1') %}
                    {% set rain = states('number.garten_gardena_ventil_1_rain_pause') %}
                    {% if state == 'open' %}
                      Status: Gießt · Batterie: {{ batt if batt not in ['unknown','unavailable'] else '-' }}% · Regenpause: {{ rain if rain not in ['unknown','unavailable'] else '-' }} d
                    {% else %}
                      Status: Standby · Batterie: {{ batt if batt not in ['unknown','unavailable'] else '-' }}% · Regenpause: {{ rain if rain not in ['unknown','unavailable'] else '-' }} d
                    {% endif %}
                  icon: mdi:water
                  icon_color: |
                    {% if is_state('valve.garten_gardena_ventil_1', 'open') %}
                      blue
                    {% else %}
                      grey
                    {% endif %}
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                entities:
                  - type: custom:mushroom-template-card
                    entity: valve.garten_gardena_ventil_1
                    primary: Ventil 1 (manuell)
                    secondary: >
                      {% if is_state('valve.garten_gardena_ventil_1', 'open') %}
                        EIN - Gießt jetzt
                      {% else %}
                        AUS - Standby
                      {% endif %}
                    icon: mdi:sprinkler-variant
                    icon_color: >
                      {% if is_state('valve.garten_gardena_ventil_1', 'open') %}
                        yellow
                      {% else %}
                        grey
                      {% endif %}
                    tap_action:
                      action: toggle
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Batterie"
                      - entity: sensor.garten_gardena_ventil_1_battery
                      - mode: battery

                  - type: custom:stack-in-card
                    mode: horizontal
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                    cards:
                      - type: custom:numberbox-card
                        entity: number.garten_gardena_ventil_1_rain_pause
                        name: Regenpause
                        icon: mdi:weather-rainy
                        unit: ' d'
                        step: 1
                        speed: 250
                        card_mod: !include /config/ui/shared/styles/flat_compact_nested.yaml
                      - type: custom:numberbox-card
                        entity: number.garten_gardena_ventil_1_manual_watering_time
                        name: Manuell
                        icon: mdi:timer-outline
                        unit: ' min'
                        step: 1
                        speed: 250
                        card_mod: !include /config/ui/shared/styles/flat_compact_nested.yaml

                  - type: custom:fold-entity-row
                    head:
                      type: section
                      label: Zeitplan (readonly kompakt)
                    entities:
                      - type: custom:mushroom-template-card
                        primary: Slot 1
                        secondary: >
                          {{ states('input_datetime.gardena_morgen_start')[0:5] if states('input_datetime.gardena_morgen_start') not in ['unknown','unavailable',''] else '--:--' }} ·
                          {{ states('input_number.gardena_dauer') | int(0) }} min
                        icon: mdi:clock-outline
                        icon_color: blue
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                        card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                      - type: custom:mushroom-template-card
                        primary: Slot 2
                        secondary: >
                          {{ states('input_datetime.gardena_abend_start')[0:5] if states('input_datetime.gardena_abend_start') not in ['unknown','unavailable',''] else '--:--' }} ·
                          {{ states('input_number.gardena_dauer_2') | int(0) }} min
                        icon: mdi:clock-outline
                        icon_color: indigo
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                        card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                      - type: custom:mushroom-template-card
                        primary: Bewässerungstage
                        secondary: >
                          {% set d = [] %}
                          {% if is_state('input_boolean.gardena_mo', 'on') %}{% set d = d + ['Mo'] %}{% endif %}
                          {% if is_state('input_boolean.gardena_di', 'on') %}{% set d = d + ['Di'] %}{% endif %}
                          {% if is_state('input_boolean.gardena_mi', 'on') %}{% set d = d + ['Mi'] %}{% endif %}
                          {% if is_state('input_boolean.gardena_do', 'on') %}{% set d = d + ['Do'] %}{% endif %}
                          {% if is_state('input_boolean.gardena_fr', 'on') %}{% set d = d + ['Fr'] %}{% endif %}
                          {% if is_state('input_boolean.gardena_sa', 'on') %}{% set d = d + ['Sa'] %}{% endif %}
                          {% if is_state('input_boolean.gardena_so', 'on') %}{% set d = d + ['So'] %}{% endif %}
                          {{ d | join(', ') if d | count > 0 else 'Keine Tage aktiv' }}
                        icon: mdi:calendar-week
                        icon_color: teal
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                        card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:fold-entity-row
                    head:
                      type: section
                      label: Historie letzte Laeufe
                    entities:
                      - type: custom:mushroom-template-card
                        primary: Letzter Start
                        secondary: "{{ states('input_text.gardena_ventil_1_last_start') if states('input_text.gardena_ventil_1_last_start') not in ['unknown','unavailable',''] else '-' }}"
                        icon: mdi:play-circle-outline
                        icon_color: green
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                        card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                      - type: custom:mushroom-template-card
                        primary: Letzter Stop
                        secondary: "{{ states('input_text.gardena_ventil_1_last_stop') if states('input_text.gardena_ventil_1_last_stop') not in ['unknown','unavailable',''] else '-' }}"
                        icon: mdi:stop-circle-outline
                        icon_color: orange
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                        card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                      - type: custom:mushroom-template-card
