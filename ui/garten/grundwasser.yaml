type: grid
cards:
  - type: heading
    icon: mdi:water-opacity
    heading: Grundwasserschacht
    heading_style: title
  - type: vertical-stack
    cards:
      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/ui/shared/styles/stack_wrapper.yaml # Stack Wrapper Style
        cards:
          - type: entities
            card_mod: !include /config/ui/shared/styles/entities_flat.yaml # Entities Flat Style
            entities:

              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  primary: Wasserstandssensor
                  icon: mdi:water-alert-outline
                  icon_color: >
                    {% if is_state('binary_sensor.garten_shelly_grundwasser',
                    'off') %}
                      green
                    {% elif is_state('binary_sensor.garten_shelly_grundwasser',
                    'on') %}
                      red
                    {% else %}
                      grey
                    {% endif %}
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                entities:
                  - type: custom:mushroom-template-card
                    primary: >
                      {% if is_state('switch.garten_shelly_grundwassersensor',
                      'on') %}
                        ⚠️ Grundwasser-Warnung!
                      {% else %}
                        ✅ Alles in Ordnung
                      {% endif %}
                    secondary: >
                      {% if is_state('switch.garten_shelly_grundwassersensor',
                      'on') %}
                        Der Sensor im Grundwasserschacht hat ausgelöst.  
                        Bitte überprüfe, ob die Pumpe noch läuft!
                      {% else %}
                        Der Grundwassersensor zeigt keine Probleme.
                      {% endif %}
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style

              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  primary: Pumpe
                  icon: mdi:pump
                  icon_color: |
                    {% if is_state('binary_sensor.pumpe_lauft', 'on') %}
                      orange
                    {% else %}
                      grey
                    {% endif %}
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                entities:
                  - type: custom:stack-in-card
                    mode: vertical
                    cards:
                      - type: entities
                        entities:
                          - entity: binary_sensor.pumpe_lauft
                            name: Pumpe Status
                          - type: custom:fold-entity-row
                            head:
                              type: section
                              label: Leistungsdaten
                            entities:
                              - entity: sensor.garten_smartplug_pumpe_current
                                name: Strom (A)
                              - entity: sensor.garten_smartplug_pumpe_voltage
                                name: Spannung (V)
                              - entity: sensor.garten_smartplug_pumpe_power
                                name: Leistung (W)
                          - entity: sensor.garten_smartplug_pumpe_laufzeit_tag
                            name: Laufzeit heute
                          - entity: sensor.garten_smartplug_pumpe_laufzeit_woche
                            name: Laufzeit diese Woche
                      - type: history-graph
                        name: Pumpenlauf Historie (7 Tage)
                        entities:
                          - binary_sensor.pumpe_lauft
                        hours_to_show: 168
                        refresh_interval: 60
