type: grid
cards:
  - type: heading
    heading: Warnungen & Fehler
    heading_style: title
    icon: mdi:alert

  - type: vertical-stack
    cards:
      - type: conditional
        conditions:
          - entity: binary_sensor.messages_has_acknowledged_errors_active
            state: 'on'
        card:
          type: custom:mushroom-template-card
          primary: Gelesene Fehler anzeigen
          secondary: >
            {{ states('sensor.messages_acknowledged_errors_active_count') | int(0) }} gelesene Fehlermeldung(en) aktiv. Tippen zum Ein-/Ausblenden.
          icon: mdi:circle
          icon_color: orange
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target:
              entity_id: input_boolean.messages_show_acknowledged

      # ++
      # ++ Trockner Health-Alert
      #
      - type: conditional
        conditions:
          - entity: binary_sensor.waschkeller_trockner_bosch_health
            state: 'off'
        card:
          type: custom:mushroom-template-card
          primary: Trockner-Verbindung gestört
          secondary: Keine gültige Bosch-Trockner-Entity gefunden. Bitte Home-Connect-Integration prüfen.
          icon: mdi:alert
          icon_color: red

      # ++
      # ++ Grundwasser Message
      #
      - type: conditional
        conditions:
          - entity: sensor.garten_grundwasser_message
            state: 'True'
        card:
          type: custom:decluttering-card
          template: message_alert
          variables:
            - entity: sensor.garten_grundwasser_message

      # ++
      # ++ Flutsensor Message
      #
      - type: conditional
        conditions:
          - entity: sensor.oelkeller_flutsensor_message
            state: 'True'
        card:
          type: custom:decluttering-card
          template: message_alert
          variables:
            - entity: sensor.oelkeller_flutsensor_message

      # ++
      # ++ Solar Wechselrichter Kommunikation Message
      #
      - type: conditional
        conditions:
          - entity: sensor.solar_wechselrichter_kommunikation_message
            state: 'True'
        card:
          type: custom:decluttering-card
          template: message_alert
          variables:
            - entity: sensor.solar_wechselrichter_kommunikation_message

      # ++
      # ++ Solar Batterie Kommunikation Message
      #
      - type: conditional
        conditions:
          - entity: sensor.solar_batterie_kommunikation_message
            state: 'True'
        card:
          type: custom:decluttering-card
          template: message_alert
          variables:
            - entity: sensor.solar_batterie_kommunikation_message

      # ++
      # ++ Solar Wechselrichter Fehler Message
      #
      - type: conditional
        conditions:
          - entity: sensor.solar_wechselrichter_fehler_message
            state: 'True'
        card:
          type: custom:decluttering-card
          template: message_alert
          variables:
            - entity: sensor.solar_wechselrichter_fehler_message

      # ++
      # ++ Solar Slave Fehler Message
      #
      - type: conditional
        conditions:
          - entity: sensor.solar_slave_fehler_message
            state: 'True'
        card:
          type: custom:decluttering-card
          template: message_alert
          variables:
            - entity: sensor.solar_slave_fehler_message

      # ++
      # ++ Solar CAN Timeout Message
      #
      - type: conditional
        conditions:
          - entity: sensor.solar_can_timeout_message
            state: 'True'
        card:
          type: custom:decluttering-card
          template: message_alert
          variables:
            - entity: sensor.solar_can_timeout_message
