title: Home
cards:
  - !include /config/ui/shared/messages.yaml
  - type: weather-forecast
    entity: weather.forecast_zuhause
  - type: markdown
    content: '## 1. Obergeschoss'
    text_only: true
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        template: overview_tile
        name: Wohnzimmer
        icon: mdi:sofa
        show_state: true
        state_display: |
          [[[ 
            const lights = [
              'light.wohnzimmer_group_esstisch',
              'light.wohnzimmer_group_wohnzimmer',
              'light.wohnzimmer_group_stahltrager',
              'light.wohnzimmer_group_schrank'
            ];
            const onCount = lights.filter(eid => states[eid]?.state === 'on').length;
            return onCount ? `💡 ${onCount} an` : '💤 Aus';
          ]]]
        tap_action:
          action: navigate
          navigation_path: view_wohnzimmer
      - type: custom:button-card
        template: overview_tile
        name: Arbeitszimmer
        icon: mdi:desk
        show_state: true
        state_display: >
          [[[ 
            const temp = states['sensor.arbeitszimmer_thermostat_local_temperature']?.state;
            return temp ? `${temp} °C` : '-';
          ]]]
        tap_action:
          action: navigate
          navigation_path: view_arbeitszimmer
      - type: custom:button-card
        template: overview_tile
        name: Küche
        icon: mdi:faucet
        show_state: true
        state_display: |
          [[[ 
            const oven = states['sensor.kueche_backofen_status_text']?.state === 'Läuft';
            const dish = states['sensor.kueche_geschirrspueler_status_text']?.state;
            let status = '💤 Aus';
            if (oven) status = '🔥 Backofen';
            else if (dish === 'Läuft') status = '🍽️ Spüler';
            else if (dish === 'Fertig') status = '✅ Fertig';
            return status;
          ]]]
        tap_action:
          action: navigate
          navigation_path: view_kueche
      - type: custom:button-card
        template: overview_tile
        name: Diele
        icon: mdi:desk
        show_state: true
        state_display: >
          [[[ 
            const temp = states['sensor.diele_thermostat_local_temperature']?.state;
            return temp ? `${temp} °C` : '-';
          ]]]
        tap_action:
          action: navigate
          navigation_path: view_diele_og
  - type: markdown
    content: '## Erdgeschoss'
    text_only: true
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        template: overview_tile
        name: Garten
        icon: mdi:flower-outline
        tap_action:
          action: navigate
          navigation_path: view_garten
  - type: markdown
    content: '## Keller'
    text_only: true
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        template: overview_tile
        name: Waschkeller
        icon: mdi:washing-machine
        tap_action:
          action: navigate
          navigation_path: view_waschkeller
      - type: custom:button-card
        template: overview_tile
        name: Ölkeller
        icon: mdi:oil
        show_state: true
        state_display: >
          [[[ return
          states['sensor.oelkeller_shellyflood_temperature'].state + ' °C';
          ]]]
        tap_action:
          action: navigate
          navigation_path: view_oelkeller
      - type: custom:button-card
        template: overview_tile
        name: Test
        icon: mdi:washing-machine
        tap_action:
          action: navigate
          navigation_path: view_test
