type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: binary_sensor.messages_has_acknowledged_errors_active
        state: 'on'
    card:
      type: custom:mushroom-template-card
      primary: Gelesene Fehler anzeigen
      secondary: >
        {{ states('sensor.messages_acknowledged_errors_active_count') | int(0) }} gelesene Fehlermeldung(en) aktiv. Tippen zum Ein-/Ausblenden.
      icon: mdi:circle
      icon_color: orange
      tap_action:
        action: call-service
        service: input_boolean.toggle
        target:
          entity_id: input_boolean.messages_show_acknowledged

  # ++
  # ++ Flutsensor Messages
  #
  - type: conditional
    conditions:
      - entity: sensor.oelkeller_flutsensor_message
        state: 'True'
    card:
      type: custom:decluttering-card
      template: message_alert
      variables:
        - entity: sensor.oelkeller_flutsensor_message
  
