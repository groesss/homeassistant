type: vertical-stack
cards:
  # ++
  # ++ Flutsensor Messages
  #
  - type: conditional
    conditions:
      - entity: sensor.oelkeller_flutsensor_message
        state: 'True'
    card:
      type: custom:decluttering-card
      template: message_alert
      variables:
        - entity: sensor.oelkeller_flutsensor_message
  
  # ++
  # ++ Grundwasser Messages
  #
