# =============================================================================
# COMPLETE THERMOSTAT TEMPLATE
# =============================================================================
# Wiederverwendbarer kompletter Thermostat-Block mit fold-entity-row
#
# Parameter:
#   - entity: climate.xyz (Required) - Climate Entity
#   - title: Anzeigename (Required) - z.B. "Wohnzimmer Heizung"
#   - battery: sensor.xyz (Required) - Batterie-Sensor  
#   - frost_temp: number.xyz (Required) - Frostschutz-Temperatur
#   - open_window: switch.xyz (Required) - Fenster-Switch
#   - child_lock: switch.xyz (Required) - Kindersicherung-Switch
#
# Features:
# - Complete fold-entity-row mit Header und allen Funktionen
# - Deutsche HVAC-Modi in der Steuerung
# - Smart Status-Zeile: Solltemperatur - Batterie - Kindersicherung
# - Alle Thermostat-Funktionen: Control, Frostschutz, Fenster, Kindersicherung, Batterie
# - UI-Instructions konform: entities_flat.yaml + card_header.yaml + flat_compact.yaml
#
# Verwendung:
#   - type: custom:decluttering-card
#     template: thermostat_card
#     variables:
#       - entity: climate.arbeitszimmer_thermostat
#       - title: Arbeitszimmer Heizung
#       - battery: sensor.arbeitszimmer_thermostat_battery
#       - frost_temp: number.arbeitszimmer_thermostat_frost_protection_temperature
#       - open_window: switch.arbeitszimmer_thermostat_open_window
#       - child_lock: switch.arbeitszimmer_thermostat_child_lock
# =============================================================================

thermostat_card:
  card:
    type: entities
    card_mod: !include /config/ui/shared/styles/entities_flat.yaml # Entities Flat Style
    entities:
      - type: custom:fold-entity-row
        head:
          type: custom:mushroom-template-card
          primary: '[[title]]'
          secondary: >-
            {{ state_attr('[[entity]]', 'temperature') }}°C - 
            🔋{{ states('[[battery]]') | int }}%
            {% if is_state('[[child_lock]]', 'on') %} - 🔒{% endif %}
          icon: mdi:thermostat
          card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
        entities:
          # Hauptthermostat - deutsche Modi
          - type: custom:mushroom-template-card
            entity: '[[entity]]'
            primary: Heizungskontrolle
            secondary: >-
              {% set hvac_mode = states('[[entity]]') %}
              {% if hvac_mode == 'heat' %}Heizen{% elif hvac_mode == 'off' %}Aus{% else %}{{ hvac_mode }}{% endif %} - 
              {{ state_attr('[[entity]]', 'temperature') }}°C
            icon: >-
              {% set hvac_mode = states('[[entity]]') %}
              {% if hvac_mode == 'heat' %}mdi:fire{% elif hvac_mode == 'off' %}mdi:power-off{% else %}mdi:thermometer{% endif %}
            icon_color: >-
              {% set hvac_mode = states('[[entity]]') %}
              {% if hvac_mode == 'heat' %}orange{% else %}grey{% endif %}
            tap_action:
              action: more-info
            hold_action:
              action: toggle
            card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Flat Style

          # Frostschutz
          - type: custom:mushroom-entity-card
            entity: '[[frost_temp]]'
            name: Frostschutz
            icon: mdi:snowflake
            card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Flat Style

          # Fenster
          - type: custom:mushroom-entity-card
            entity: '[[open_window]]'
            name: Fenster
            icon: mdi:window-open
            tap_action:
              action: toggle
            card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Flat Style
           
          # Kindersicherung
          - type: custom:mushroom-entity-card
            entity: '[[child_lock]]'
            name: Kindersicherung
            icon: mdi:human-child
            tap_action:
              action: toggle
            card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Flat Style

          # Battery 
          - type: custom:decluttering-card
            template: progress_bar
            variables:
              - title: "Batterie"
              - entity: '[[battery]]'
              - mode: battery
