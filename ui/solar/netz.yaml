type: grid
cards:
  - type: heading
    heading: Stromnetz
    heading_style: title
    icon: mdi:transmission-tower

  - type: vertical-stack
    cards:
      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/ui/shared/styles/stack_wrapper.yaml
        cards:
          - type: entities
            card_mod: !include /config/ui/shared/styles/entities_flat.yaml
            entities:
              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  primary: Aktuelle Leistung
                  secondary: >
                    {% set p = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_power') | float(0) %}
                    {% set ap = p | abs %}
                    {% if p > 50 %}Bezug: {% if ap >= 1000 %}{{ (ap / 1000) | round(2) }} kW{% else %}{{ ap | round(0) }} W{% endif %}
                    {% elif p < -50 %}Einspeisung: {% if ap >= 1000 %}{{ (ap / 1000) | round(2) }} kW{% else %}{{ ap | round(0) }} W{% endif %}
                    {% else %}Autark{% endif %}
                  icon: mdi:transmission-tower
                  icon_color: >
                    {% set p = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_power') | float(0) %}
                    {% if p > 50 %}red{% elif p < -50 %}green{% else %}grey{% endif %}
                  card_mod: !include /config/ui/shared/styles/card_header.yaml
                entities:
                  - type: custom:mushroom-template-card
                    primary: Gesamt
                    secondary: >
                      {% set p = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_power') | float(0) %}
                      {% set ap = p | abs %}
                      {% if ap >= 1000 %}{{ (p / 1000) | round(2) }} kW{% else %}{{ p | round(0) }} W{% endif %}
                    icon: mdi:flash
                    icon_color: >
                      {% set p = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_power') | float(0) %}
                      {% if p > 50 %}red{% elif p < -50 %}green{% else %}grey{% endif %}
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Phase L1
                    secondary: >
                      {% set p = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_power_p1') | float(0) %}
                      {% set u = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_voltage_p1') | float(0) %}
                      {% if (p | abs) >= 1000 %}{{ (p / 1000) | round(2) }} kW{% else %}{{ p | round(0) }} W{% endif %} | {{ u | round(1) }} V
                    icon: mdi:numeric-1-circle-outline
                    icon_color: blue
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Phase L2
                    secondary: >
                      {% set p = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_power_p2') | float(0) %}
                      {% set u = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_voltage_p2') | float(0) %}
                      {% if (p | abs) >= 1000 %}{{ (p / 1000) | round(2) }} kW{% else %}{{ p | round(0) }} W{% endif %} | {{ u | round(1) }} V
                    icon: mdi:numeric-2-circle-outline
                    icon_color: blue
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Phase L3
                    secondary: >
                      {% set p = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_power_p3') | float(0) %}
                      {% set u = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_voltage_p3') | float(0) %}
                      {% if (p | abs) >= 1000 %}{{ (p / 1000) | round(2) }} kW{% else %}{{ p | round(0) }} W{% endif %} | {{ u | round(1) }} V
                    icon: mdi:numeric-3-circle-outline
                    icon_color: blue
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Netzfrequenz
                    secondary: "{{ states('sensor.ps_10_0_hc2g_rct_power_storage_grid_frequency') | float(0) | round(2) }} Hz"
                    icon: mdi:sine-wave
                    icon_color: grey
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  primary: Energiebilanz
                  secondary: >
                    {% set b = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_energy_consumption_day') | float(0) %}
                    {% set e = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_energy_production_day') | float(0) | abs %}
                    Bezug: {% if b >= 1000 %}{{ (b / 1000) | round(2) }} kWh{% else %}{{ b | round(0) }} Wh{% endif %} | Einspeisung: {% if e >= 1000 %}{{ (e / 1000) | round(2) }} kWh{% else %}{{ e | round(0) }} Wh{% endif %}
                  icon: mdi:counter
                  icon_color: blue
                  card_mod: !include /config/ui/shared/styles/card_header.yaml
                entities:
                  - type: custom:mushroom-template-card
                    primary: Bezug heute
                    secondary: >
                      {% set e = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_energy_consumption_day') | float(0) %}
                      {% if e >= 1000 %}{{ (e / 1000) | round(3) }} kWh{% else %}{{ e | round(0) }} Wh{% endif %}
                    icon: mdi:transmission-tower-import
                    icon_color: red
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Bezug diesen Monat
                    secondary: >
                      {% set e = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_energy_consumption_month') | float(0) %}
                      {% if e >= 1000 %}{{ (e / 1000) | round(1) }} kWh{% else %}{{ e | round(0) }} Wh{% endif %}
                    icon: mdi:transmission-tower-import
                    icon_color: red
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Bezug dieses Jahr
                    secondary: >
                      {% set e = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_energy_consumption_year') | float(0) %}
                      {% if e >= 1000 %}{{ (e / 1000) | round(0) }} kWh{% else %}{{ e | round(0) }} Wh{% endif %}
                    icon: mdi:transmission-tower-import
                    icon_color: red
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Einspeisung heute
                    secondary: >
                      {% set e = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_energy_production_day') | float(0) | abs %}
                      {% if e >= 1000 %}{{ (e / 1000) | round(3) }} kWh{% else %}{{ e | round(0) }} Wh{% endif %}
                    icon: mdi:transmission-tower-export
                    icon_color: green
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Einspeisung diesen Monat
                    secondary: >
                      {% set e = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_energy_production_month') | float(0) | abs %}
                      {% if e >= 1000 %}{{ (e / 1000) | round(1) }} kWh{% else %}{{ e | round(0) }} Wh{% endif %}
                    icon: mdi:transmission-tower-export
                    icon_color: green
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                  - type: custom:mushroom-template-card
                    primary: Einspeisung Gesamt (absolut)
                    secondary: >
                      {% set e = states('sensor.ps_10_0_hc2g_rct_power_storage_grid_energy_production_absolute_total') | float(0) %}
                      {% if e >= 1000 %}{{ (e / 1000) | round(1) }} kWh{% else %}{{ e | round(0) }} Wh{% endif %}
                    icon: mdi:sigma
                    icon_color: green
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

  - type: custom:mini-graph-card
    entities:
      - entity: sensor.ps_10_0_hc2g_rct_power_storage_grid_power_p1
        name: L1
        color: '#e53935'
      - entity: sensor.ps_10_0_hc2g_rct_power_storage_grid_power_p2
        name: L2
        color: '#fb8c00'
      - entity: sensor.ps_10_0_hc2g_rct_power_storage_grid_power_p3
        name: L3
        color: '#8e24aa'
      - entity: sensor.ps_10_0_hc2g_rct_power_storage_grid_power
        name: Gesamt
        color: '#1e88e5'
    hours_to_show: 24
    points_per_hour: 4
    line_width: 2
    smoothing: true
    show:
      points: false
      labels: false
      legend: true
    name: Netzleistung je Phase (24h)
    icon: mdi:chart-line
