type: sections
max_columns: 4
title: Tests
path: tests
icon: mdi:beaker-question
sections:
  - type: grid
    cards:
      # Progress Bar Tests
      - type: custom:mushroom-template-card
        primary: Progress Bar Tests
        secondary: Alle Modi, Farben, Edge-Cases
        icon: mdi:chart-line-variant
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /lovelace/0/8
        card_mod:
          style: |
            ha-card {
              border: 2px solid var(--blue-color);
            }
      
      # Platzhalter für weitere Test-Bereiche
      - type: custom:mushroom-template-card
        primary: Thermostat Tests
        secondary: Coming soon...
        icon: mdi:thermostat
        icon_color: orange
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              border: 2px dashed var(--orange-color);
              opacity: 0.6;
            }
      
      - type: custom:mushroom-template-card  
        primary: Timer Tests
        secondary: Coming soon...
        icon: mdi:timer
        icon_color: green
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              border: 2px dashed var(--green-color);
              opacity: 0.6;
            }

      - type: custom:mushroom-template-card
        primary: Message Tests
        secondary: Coming soon...
        icon: mdi:message-alert
        icon_color: red
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              border: 2px dashed var(--red-color);
              opacity: 0.6;
            }