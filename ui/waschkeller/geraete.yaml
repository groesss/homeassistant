type: grid
cards:
  - type: heading
    heading: Geräte
    heading_style: title
  - type: vertical-stack
    cards:
      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/ui/shared/styles/stack_wrapper.yaml
        cards:
          - type: entities
            card_mod: !include /config/ui/shared/styles/entities_flat.yaml
            entities:

              # ++
              # ++ Wäschetrockner
              #
              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  entity: sensor.waschkeller_trockner_status_text
                  primary: 🧺 Wäschetrockner Rechts (Bosch)
                  icon: mdi:tumble-dryer
                  icon_color: >
                    {% set status = states('sensor.waschkeller_trockner_status_text') %}
                    {% if status == 'Läuft' %}orange
                    {% elif status in ['Fertig', 'Bereit'] %}green
                    {% elif status == 'Pausiert' %}yellow
                    {% elif status == 'Gestoppt' %}red
                    {% elif status == 'Ausgeschaltet' %}grey
                    {% else %}blue{% endif %}
                  secondary: "{{ states('sensor.waschkeller_trockner_status_text') }}"
                  card_mod: !include /config/ui/shared/styles/card_header.yaml
                entities:
                  - type: custom:mushroom-template-card
                    primary: >-
                      Status: {{ states('sensor.waschkeller_trockner_status_text') }}
                    secondary: >
                      {% set time = states('sensor.waschkeller_trockner_remaining_program_time') %}
                      {% if time in ['unknown', 'unavailable', '', None] %}
                        -
                      {% else %}
                        {% set end = as_timestamp(time) %}
                        {% set diff = (end - now().timestamp()) / 60 %}
                        {% if diff > 1 %}
                          Fertig um: {{ end | timestamp_custom('%H:%M') }} (noch {{ diff | round(0) }} Minuten)
                        {% elif diff > 0 %}
                          Fertig um: {{ end | timestamp_custom('%H:%M') }} (gleich fertig)
                        {% else %}
                          -
                        {% endif %}
                      {% endif %}
                    icon: mdi:tumble-dryer
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Programm
                    secondary: "{{ states('sensor.waschkeller_trockner_aktives_programm_text') }}"
                    icon: mdi:playlist-play
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Fortschritt"
                      - entity: sensor.waschkeller_trockner_program_progress
                      - max: 100
                      - icon: mdi:progress-clock

                  - type: custom:mushroom-entity-card
                    entity: switch.waschkeller_trockner_powerstate
                    name: Wäschetrockner
                    icon: mdi:tumble-dryer
                    tap_action:
                      action: toggle
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

              # ++
              # ++ Waschmaschine Rechts (Mitte)
              #
              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  entity: sensor.waschkeller_waschmaschine_rechts_status
                  primary: 🧺 Waschmaschine Mitte (Bosch)
                  icon: mdi:washing-machine
                  icon_color: >
                    {% set s = states('sensor.waschkeller_waschmaschine_rechts_status') %}
                    {% if s == 'Laeuft' %}orange
                    {% elif s == 'Fertig' %}green
                    {% elif s == 'Bereit' %}yellow
                    {% else %}grey{% endif %}
                  layout: horizontal
                  secondary: >
                    {% set s = states('sensor.waschkeller_waschmaschine_rechts_status') %}
                    {% if s == 'Laeuft' %}
                      {% set prog = states('sensor.waschmaschine_rechts_programm') %}
                      {% set rest = states('sensor.waschmaschine_rechts_verbleibende_zeit') %}
                      {% set rest_fmt = rest %}
                      {% if rest and ':' in rest|string %}
                        {# ISO/HH:MM:SS? meist MM:SS oder H:MM:SS, aber Washdata gibt oft lesbar, fallback #}
                        {% set parts = rest|string.split(':') %}
                        {% if parts | length == 2 %}
                          {% set rest_fmt = parts[0] ~ ' min' if parts[0] != '0' else parts[1] ~ ' min' %}
                        {% elif parts | length == 3 %}
                          {% set h = parts[0] | int(0) %}
                          {% set m = parts[1] | int(0) %}
                          {% if h > 0 and m > 0 %}{% set rest_fmt = h ~ 'h ' ~ m ~ ' min' %}{% elif h > 0 %}{% set rest_fmt = h ~ 'h' %}{% else %}{% set rest_fmt = m ~ ' min' %}{% endif %}
                        {% endif %}
                      {% elif rest and 'h' in rest|string and 'm' in rest|string %}
                        {% set rest_fmt = rest|string | replace('m',' min') %}
                      {% elif rest and 'm' in rest|string %}
                        {% set rest_fmt = rest|string | replace('m',' min') %}
                      {% elif rest and rest|regex_match('^[0-9]+$') %}
                        {% set rest_fmt = rest ~ ' min' %}
                      {% endif %}
                      {{ prog if prog not in ['unknown','unavailable','none',''] else '' }} {{ states('sensor.waschmaschine_rechts_fortschritt') | float(0) | round(0) }}% noch {{ rest_fmt }}
                    {% elif s == 'Fertig' %}Fertig · Ausgeräumt!
                    {% elif s == 'Bereit' %}Bereit
                    {% else %}Aus{% endif %}
                  card_mod: !include /config/ui/shared/styles/card_header.yaml
                entities:
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Fortschritt"
                      - entity: sensor.waschmaschine_rechts_fortschritt
                      - max: 100
                      - icon: mdi:progress-clock

                  - type: custom:mushroom-template-card
                    primary: Restzeit
                    secondary: >
                      {% set r = states('sensor.waschmaschine_rechts_verbleibende_zeit') %}
                      {% set rfmt = r %}
                      {% if r and ':' in r|string %}
                        {% set parts = r|string.split(':') %}
                        {% if parts | length == 2 %}
                          {% set m = parts[0] | int(0) %}{% set rfmt = m ~ ' min' %}
                        {% elif parts | length == 3 %}
                          {% set h = parts[0] | int(0) %}{% set m = parts[1] | int(0) %}
                          {% if h>0 and m>0 %}{% set rfmt = h ~ 'h ' ~ m ~ ' min' %}{% elif h>0 %}{% set rfmt = h ~ 'h' %}{% else %}{% set rfmt = m ~ ' min' %}{% endif %}
                        {% endif %}
                      {% elif r and r|string | regex_match('^[0-9]+$') %}{% set rfmt = r ~ ' min' %}
                      {% endif %}
                      {% if r not in ['unknown', 'none', 'unavailable'] %}{{ rfmt }}{% else %}–{% endif %}
                    icon: mdi:timer-sand
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Phase
                    secondary: >
                      {% set p = states('sensor.waschmaschine_rechts_aktuelle_phase') %}
                      {{ p if p not in ['off', 'unknown', 'none'] else '–' }}
                    icon: mdi:rotate-3d-variant
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Programm
                    secondary: >
                      {% set p = states('sensor.waschmaschine_rechts_programm') %}
                      {{ p if p not in ['off', 'unknown', 'none'] else '–' }}
                    icon: mdi:playlist-play
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Energie
                    secondary: >
                      {{ states('sensor.waschmaschine_rechts_energie_gesamt') }} kWh
                    icon: mdi:lightning-bolt
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Zyklen heute
                    secondary: "{{ states('sensor.waschmaschine_rechts_zyklusanzahl') }}"
                    icon: mdi:counter
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

              # ++
              # ++ Waschmaschine Links (AEG)
              #
              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  entity: sensor.waschkeller_waschmaschine_links_status
                  primary: 🧺 Waschmaschine Links (AEG)
                  icon: mdi:washing-machine
                  icon_color: >
                    {% set s = states('sensor.waschkeller_waschmaschine_links_status') %}
                    {% if s == 'Laeuft' %}orange
                    {% elif s == 'Fertig' %}green
                    {% elif s == 'Bereit' %}yellow
                    {% else %}grey{% endif %}
                  layout: horizontal
                  secondary: >
                    {% set s = states('sensor.waschkeller_waschmaschine_links_status') %}
                    {% if s == 'Laeuft' %}
                      {% set prog = states('sensor.waschmaschine_links_programm') %}
                      {% set rest = states('sensor.waschmaschine_links_verbleibende_zeit') %}
                      {% set rest_fmt = rest %}
                      {% if rest and ':' in rest|string %}
                        {% set parts = rest|string.split(':') %}
                        {% if parts | length == 2 %}
                          {% set m = parts[0] | int(0) %}
                          {% set rest_fmt = m ~ ' min' %}
                        {% elif parts | length == 3 %}
                          {% set h = parts[0] | int(0) %}
                          {% set m = parts[1] | int(0) %}
                          {% if h > 0 and m > 0 %}{% set rest_fmt = h ~ 'h ' ~ m ~ ' min' %}{% elif h > 0 %}{% set rest_fmt = h ~ 'h' %}{% else %}{% set rest_fmt = m ~ ' min' %}{% endif %}
                        {% endif %}
                      {% elif rest and 'h' in rest|string and 'm' in rest|string %}
                        {% set rest_fmt = rest|string | replace('m',' min') %}
                      {% elif rest and 'm' in rest|string %}
                        {% set rest_fmt = rest|string | replace('m',' min') %}
                      {% elif rest and rest|regex_match('^[0-9]+$') %}
                        {% set rest_fmt = rest ~ ' min' %}
                      {% endif %}
                      {{ prog if prog not in ['unknown','unavailable','none',''] else '' }} {{ states('sensor.waschmaschine_links_fortschritt') | float(0) | round(0) }}% noch {{ rest_fmt }}
                    {% elif s == 'Fertig' %}Fertig · Ausgeräumt!
                    {% elif s == 'Bereit' %}Bereit
                    {% else %}Aus{% endif %}
                  card_mod: !include /config/ui/shared/styles/card_header.yaml
                entities:
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Fortschritt"
                      - entity: sensor.waschmaschine_links_fortschritt
                      - max: 100
                      - icon: mdi:progress-clock

                  - type: custom:mushroom-template-card
                    primary: Restzeit
                    secondary: >
                      {% set r = states('sensor.waschmaschine_links_verbleibende_zeit') %}
                      {% set rfmt = r %}
                      {% if r and ':' in r|string %}
                        {% set parts = r|string.split(':') %}
                        {% if parts | length == 2 %}
                          {% set m = parts[0] | int(0) %}{% set rfmt = m ~ ' min' %}
                        {% elif parts | length == 3 %}
                          {% set h = parts[0] | int(0) %}{% set m = parts[1] | int(0) %}
                          {% if h>0 and m>0 %}{% set rfmt = h ~ 'h ' ~ m ~ ' min' %}{% elif h>0 %}{% set rfmt = h ~ 'h' %}{% else %}{% set rfmt = m ~ ' min' %}{% endif %}
                        {% endif %}
                      {% elif r and r|string | regex_match('^[0-9]+$') %}{% set rfmt = r ~ ' min' %}
                      {% endif %}
                      {% if r not in ['unknown', 'none', 'unavailable'] %}{{ rfmt }}{% else %}–{% endif %}
                    icon: mdi:timer-sand
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Phase
                    secondary: >
                      {% set p = states('sensor.waschmaschine_links_aktuelle_phase') %}
                      {{ p if p not in ['off', 'unknown', 'none'] else '–' }}
                    icon: mdi:rotate-3d-variant
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Programm
                    secondary: >
                      {% set p = states('sensor.waschmaschine_links_programm') %}
                      {{ p if p not in ['off', 'unknown', 'none'] else '–' }}
                    icon: mdi:playlist-play
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Energie
                    secondary: >
                      {{ states('sensor.waschmaschine_links_energie_gesamt') }} kWh
                    icon: mdi:lightning-bolt
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

                  - type: custom:mushroom-template-card
                    primary: Zyklen heute
                    secondary: "{{ states('sensor.waschmaschine_links_zyklusanzahl') }}"
                    icon: mdi:counter
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml

      # ++
      # ++ History (außerhalb fold-entity-row)
      #
      - type: history-graph
        title: Letzte 24h
        hours_to_show: 24
        entities:
          - entity: sensor.waschkeller_trockner_program_progress
            name: Trockner (Rechts)
          - entity: binary_sensor.waschmaschine_rechts_lauft
            name: WM (Mitte)
          - entity: binary_sensor.waschmaschine_links_lauft
            name: WM (Links)
          
