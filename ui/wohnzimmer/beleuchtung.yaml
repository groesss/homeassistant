type: grid
cards:
  - type: heading
    heading: Beleuchtung
    heading_style: title
    icon: mdi:lightbulb-group-outline
  - type: vertical-stack
    cards:
      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/ui/shared/styles/stack_wrapper.yaml # Stack Wrapper Style
        cards:
          - type: entities
            card_mod: !include /config/ui/shared/styles/entities_flat.yaml # Entities Flat Style
            entities:

              # ++
              # ++ Lampen
              # 
              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  primary: Lampen
                  secondary: |-
                    {{ expand('light.wohnzimmer_group_esstisch',
                               'light.wohnzimmer_group_wohnzimmer',
                               'light.wohnzimmer_group_stahltrager',
                               'light.wohnzimmer_group_schrank')
                       | selectattr('state','eq','on') | list | count }} von 4 an
                  icon: mdi:lightbulb-group
                  icon_color: |-
                    {% set lights = [
                      'light.wohnzimmer_group_esstisch',
                      'light.wohnzimmer_group_wohnzimmer',
                      'light.wohnzimmer_group_stahltrager',
                      'light.wohnzimmer_group_schrank'] %}
                    {% if lights | select('is_state','on') | list | count > 0 %}
                      yellow
                    {% else %}
                      grey
                    {% endif %}
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                entities:
                  - type: custom:mushroom-template-card
                    entity: light.wohnzimmer_group_esstisch
                    tap_action:
                      action: toggle
                    primary: Esstisch
                    icon: mdi:ceiling-light
                    icon_color: |-
                      {% if is_state('light.wohnzimmer_group_esstisch', 'on') %}
                        yellow
                      {% else %}
                        grey
                      {% endif %}
                    secondary: |-
                      {% if is_state('light.wohnzimmer_group_esstisch', 'on') %}
                        {{ (state_attr('light.wohnzimmer_group_esstisch', 'brightness') | default(0) | int / 2.55) | round(0) }} %
                      {% else %}
                        Aus
                      {% endif %}
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style
                  - type: custom:mushroom-template-card
                    entity: light.wohnzimmer_group_wohnzimmer
                    tap_action:
                      action: toggle
                    primary: Wohnzimmer
                    icon: mdi:floor-lamp
                    icon_color: |-
                      {% if is_state('light.wohnzimmer_group_wohnzimmer', 'on') %}
                        yellow
                      {% else %}
                        grey
                      {% endif %}
                    secondary: |-
                      {% if is_state('light.wohnzimmer_group_wohnzimmer', 'on') %}
                        {{ (state_attr('light.wohnzimmer_group_wohnzimmer', 'brightness') | default(0) | int / 2.55) | round(0) }} %
                      {% else %}
                        Aus
                      {% endif %}
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style
                  - type: custom:mushroom-template-card
                    entity: light.wohnzimmer_group_stahltrager
                    tap_action:
                      action: toggle
                    primary: Stahlträger
                    icon: mdi:track-light
                    icon_color: |-
                      {% if is_state('light.wohnzimmer_group_stahltrager', 'on') %}
                        yellow
                      {% else %}
                        grey
                      {% endif %}
                    secondary: |-
                      {% if is_state('light.wohnzimmer_group_stahltrager', 'on') %}
                        {{ (state_attr('light.wohnzimmer_group_stahltrager', 'brightness') | default(0) | int / 2.55) | round(0) }} %
                      {% else %}
                        Aus
                      {% endif %}
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style
                  - type: custom:mushroom-template-card
                    entity: light.wohnzimmer_group_schrank
                    tap_action:
                      action: toggle
                    primary: Schrank
                    icon: mdi:wall-sconce
                    icon_color: |-
                      {% if is_state('light.wohnzimmer_group_schrank', 'on') %}
                        yellow
                      {% else %}
                        grey
                      {% endif %}
                    secondary: |-
                      {% if is_state('light.wohnzimmer_group_schrank', 'on') %}
                        {{ (state_attr('light.wohnzimmer_group_schrank', 'brightness') | default(0) | int / 2.55) | round(0) }} %
                      {% else %}
                        Aus
                      {% endif %}
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style

              # ++
              # ++ Szenen
              # 
              - type: custom:fold-entity-row
                open: false
                head:
                  type: custom:mushroom-template-card
                  primary: Szenen
                  icon: mdi:palette
                  icon_color: indigo
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                entities:
                  - type: custom:stack-in-card
                    mode: vertical
                    cards:
                      - type: horizontal-stack
                        cards:
                          - type: custom:mushroom-template-card
                            icon: mdi:candle
                            primary: Besinnlich
                            icon_color: deep-orange
                            tap_action:
                              action: call-service
                              service: scene.turn_on
                              data:
                                entity_id: scene.wohnzimmer_lights_scene_besinnlich
                            card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                          - type: custom:mushroom-template-card
                            icon: mdi:city
                            primary: Fairfax
                            icon_color: teal
                            tap_action:
                              action: call-service
                              service: scene.turn_on
                              data:
                                entity_id: scene.wohnzimmer_lights_scene_fairfax
                            card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                          - type: custom:mushroom-template-card
                            icon: mdi:star-four-points
                            primary: Galaxy
                            icon_color: purple
                            tap_action:
                              action: call-service
                              service: scene.turn_on
                              data:
                                entity_id: scene.wohnzimmer_lights_scene_galaxy
                            card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                      - type: horizontal-stack
                        cards:
                          - type: custom:mushroom-template-card
                            icon: mdi:weather-sunny
                            primary: Hell
                            icon_color: yellow
                            tap_action:
                              action: call-service
                              service: scene.turn_on
                              data:
                                entity_id: scene.wohnzimmer_lights_scene_hell
                            card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                          - type: custom:mushroom-template-card
                            icon: mdi:home-floor-2
                            primary: Hell OG
                            icon_color: amber
                            tap_action:
                              action: call-service
                              service: scene.turn_on
                              data:
                                entity_id: scene.wohnzimmer_lights_scene_hell_upperfloor
                            card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                          - type: custom:mushroom-template-card
                            icon: mdi:beach
                            primary: Rio
                            icon_color: red
                            tap_action:
                              action: call-service
                              service: scene.turn_on
                              data:
                                entity_id: scene.wohnzimmer_lights_scene_rio
                            card_mod: !include /config/ui/shared/styles/flat_compact.yaml
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml
