type: grid
cards:
  - type: heading
    heading: TV
    heading_style: title
    icon: mdi:television
  - type: vertical-stack
    cards:
      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/ui/shared/styles/stack_wrapper.yaml # Stack Wrapper Style
        cards:
          - type: entities
            card_mod: !include /config/ui/shared/styles/entities_flat.yaml # Entities Flat Style
            entities:

              # ++
              # ++ Fernseher
              # 
              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  primary: Fernseher
                  icon: mdi:television
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                  icon_color: >
                    {% set status =
                    states('media_player.wohnzimmer_tv_samsung_q90_series_75')
                    %} {% if status in ['on', 'playing'] %}
                      orange
                    {% elif status in ['off', 'idle'] %}
                      grey
                    {% else %}
                      blue
                    {% endif %}
                entities:
                  - type: custom:mushroom-entity-card
                    entity: media_player.wohnzimmer_tv_samsung_q90_series_75
                    name: 📺 Samsung Fernseher
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style

                  # Quellen-Statistik Überschrift
                  - type: custom:mushroom-title-card
                    title: tägliche Zeitverteilung
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Header Style

                                    
                  # Netflix 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Netflix"
                      - entity: input_number.wohnzimmer_tv_minute_count_netflix
                      - secondary_sensor: input_number.wohnzimmer_tv_minute_count_netflix
                      - max: 100
                      - icon: mdi:netflix
                      - color: red
                     
                  # YouTube 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "YouTube"
                      - entity: input_number.wohnzimmer_tv_minute_count_youtube
                      - secondary_sensor: input_number.wohnzimmer_tv_minute_count_youtube
                      - max: 100
                      - icon: mdi:youtube
                      - color: red
                
                 # Prime Video 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Prime Video"
                      - entity: input_number.wohnzimmer_tv_minute_count_prime
                      - secondary_sensor: input_number.wohnzimmer_tv_minute_count_prime
                      - max: 100
                      - icon: mdi:movie-filter
                      - color: cyan

                 # Disney+ 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Disney+"
                      - entity: input_number.wohnzimmer_tv_minute_count_disney
                      - secondary_sensor: input_number.wohnzimmer_tv_minute_count_disney
                      - max: 100
                      - icon: mdi:star-shooting
                      - color: blue

                  # PLEX 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Plex"
                      - entity: input_number.wohnzimmer_tv_minute_count_plex
                      - secondary_sensor: input_number.wohnzimmer_tv_minute_count_plex
                      - max: 100
                      - icon: mdi:plex
                      - color: yellow
                  
                  # HDMI 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "HDMI"
                      - entity: input_number.wohnzimmer_tv_minute_count_hdmi
                      - secondary_sensor: input_number.wohnzimmer_tv_minute_count_hdmi
                      - max: 100
                      - icon: mdi:hdmi-port
                      - color: grey
                  
                  # TV 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "TV"
                      - entity: input_number.wohnzimmer_tv_minute_count_tv
                      - secondary_sensor: input_number.wohnzimmer_tv_minute_count_andere
                      - max: 100
                      - icon: mdi:television-classic
                      - color: green                 
                  
                  # Andere 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "Andere"
                      - entity: input_number.wohnzimmer_tv_minute_count_andere
                      - secondary_sensor: input_number.wohnzimmer_tv_minute_count_andere
                      - max: 100
                      - icon: mdi:dots-horizontal
                      - color: purple

              # ++
              # ++ Kindersicherung
              # 
              - type: custom:fold-entity-row
                open: false
                head:
                  type: custom:mushroom-template-card
                  primary: Kindersicherung
                  icon: mdi:human-child
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                  icon_color: >
                    {% set status =
                    states('input_boolean.wohnzimmer_tv_kindersicherung') %} {%
                    if status == 'on' %}
                      orange
                    {% elif status == 'off' %}
                      grey
                    {% else %}
                      blue
                    {% endif %}
                entities:
                  - type: custom:stack-in-card
                    mode: horizontal
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style
                    cards:
                      - type: custom:mushroom-entity-card
                        entity: input_boolean.wohnzimmer_tv_kindersicherung
                        name: Kindersicherung
                        icon: mdi:shield-check
                        tap_action:
                          action: toggle
                        card_mod: !include /config/ui/shared/styles/flat_compact_nested.yaml # Nested Card Style
                      - type: custom:mushroom-entity-card
                        entity: switch.wohnzimmer_smartplug_tv
                        name: Steckdose (TV)
                        icon: mdi:power-socket-de
                        tap_action:
                          action: toggle
                        card_mod: !include /config/ui/shared/styles/flat_compact_nested.yaml # Nested Card Style
                  - type: custom:stack-in-card
                    mode: horizontal
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style
                    cards:
                      - type: custom:numberbox-card
                        entity: input_number.wohnzimmer_tv_timer_number
                        name: Zeitlimit (15min)
                        icon: mdi:timer
                        unit: ' min'
                        step: 15
                        speed: 250
                        card_mod:
                          style: |
                            ha-card {
                              border: none !important;
                              box-shadow: none !important;
                              background: transparent !important;
                              border-radius: 0 !important;
                              margin: 0 0 0 0px !important;
                              padding: 0 !important;
                              {% if is_state('input_boolean.wohnzimmer_tv_kindersicherung', 'off') %}
                              filter: grayscale(1) opacity(0.5);
                              pointer-events: none;
                              {% endif %}
                            }
                      - type: custom:numberbox-card
                        entity: input_number.wohnzimmer_tv_timer_number
                        name: Feineinstellung
                        icon: mdi:tune
                        unit: ' min'
                        step: 1
                        speed: 100
                        card_mod:
                          style: |
                            ha-card {
                              border: none !important;
                              box-shadow: none !important;
                              background: transparent !important;
                              border-radius: 0 !important;
                              margin: 0 0 0 0px !important;
                              padding: 0 !important;
                              {% if is_state('input_boolean.wohnzimmer_tv_kindersicherung', 'off') %}
                              filter: grayscale(1) opacity(0.5);
                              pointer-events: none;
                              {% endif %}
                            }
                  # Zeitverbrauch heute 
                  - type: custom:decluttering-card
                    template: progress_bar
                    variables:
                      - title: "TV-Zeitverbrauch heute"
                      - secondary_sensor: sensor.wohnzimmer_tv_timer_verbleibend
                      - entity: counter.wohnzimmer_tv_watch_minutes
                      - max: input_number.wohnzimmer_tv_timer_number
                      - icon: mdi:clock-time-eight              
                      - mode: inverse # Farbdarstellung umgekehrt                  

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.wohnzimmer_tv_kindersicherung
                state: 'on'
            card:
              type: markdown
              content: >
                **👨‍👩‍👧 Kindersicherung ist aktiv.**   (noch **{{
                states('input_number.wohnzimmer_tv_timer_number') | float |
                round(0) | int - 
                states('counter.wohnzimmer_tv_watch_minutes') | float |
                round(0) | int }} Minuten** übrig)


                Wenn die erlaubte Zeit von **{{
                states('input_number.wohnzimmer_tv_timer_number') | float |
                round(0) | int }} Minuten** erreicht ist, wird die Steckdose
                **automatisch ausgeschaltet**.
              card_mod: !include /config/ui/shared/styles/markdown_plain.yaml # Markdown Plain Style
