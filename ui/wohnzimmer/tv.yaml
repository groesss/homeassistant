type: grid
cards:
  - type: heading
    heading: TV
    heading_style: title
    icon: mdi:television
  - type: vertical-stack
    cards:
      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/ui/shared/styles/stack_wrapper.yaml # Stack Wrapper Style
        cards:
          - type: entities
            card_mod: !include /config/ui/shared/styles/entities_flat.yaml # Entities Flat Style
            entities:

              # ++
              # ++ Fernseher
              # 
              - type: custom:fold-entity-row
                head:
                  type: custom:mushroom-template-card
                  primary: Fernseher
                  icon: mdi:television
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                  icon_color: >
                    {% set status =
                    states('media_player.wohnzimmer_tv_samsung_q90_series_75')
                    %} {% if status in ['on', 'playing'] %}
                      orange
                    {% elif status in ['off', 'idle'] %}
                      grey
                    {% else %}
                      blue
                    {% endif %}
                entities:
                  - type: custom:mushroom-entity-card
                    entity: media_player.wohnzimmer_tv_samsung_q90_series_75
                    name: 📺 Samsung Fernseher
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style

              # ++
              # ++ Kindersicherung
              # 
              - type: custom:fold-entity-row
                open: false
                head:
                  type: custom:mushroom-template-card
                  primary: Kindersicherung
                  icon: mdi:human-child
                  card_mod: !include /config/ui/shared/styles/card_header.yaml # Header Style
                  icon_color: >
                    {% set status =
                    states('input_boolean.wohnzimmer_tv_kindersicherung') %} {%
                    if status == 'on' %}
                      orange
                    {% elif status == 'off' %}
                      grey
                    {% else %}
                      blue
                    {% endif %}
                entities:
                  - type: custom:stack-in-card
                    mode: horizontal
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style
                    cards:
                      - type: custom:mushroom-entity-card
                        entity: input_boolean.wohnzimmer_tv_kindersicherung
                        name: Kindersicherung
                        icon: mdi:shield-check
                        tap_action:
                          action: toggle
                        card_mod: !include /config/ui/shared/styles/flat_compact_nested.yaml # Nested Card Style
                      - type: custom:mushroom-entity-card
                        entity: switch.wohnzimmer_smartplug_tv
                        name: Steckdose (TV)
                        icon: mdi:power-socket-de
                        tap_action:
                          action: toggle
                        card_mod: !include /config/ui/shared/styles/flat_compact_nested.yaml # Nested Card Style
                  - type: custom:stack-in-card
                    mode: horizontal
                    card_mod: !include /config/ui/shared/styles/flat_compact.yaml # Card Compact Style
                    cards:
                      - type: custom:numberbox-card
                        entity: input_number.wohnzimmer_tv_timer_number
                        name: Zeitlimit (15min)
                        icon: mdi:timer
                        unit: ' min'
                        step: 15
                        speed: 250
                        card_mod:
                          style: |
                            ha-card {
                              border: none !important;
                              box-shadow: none !important;
                              background: transparent !important;
                              border-radius: 0 !important;
                              margin: 0 0 0 0px !important;
                              padding: 0 !important;
                              {% if is_state('input_boolean.wohnzimmer_tv_kindersicherung', 'off') %}
                              filter: grayscale(1) opacity(0.5);
                              pointer-events: none;
                              {% endif %}
                            }
                      - type: custom:numberbox-card
                        entity: input_number.wohnzimmer_tv_timer_number
                        name: Feineinstellung
                        icon: mdi:tune
                        unit: ' min'
                        step: 1
                        speed: 100
                        card_mod:
                          style: |
                            ha-card {
                              border: none !important;
                              box-shadow: none !important;
                              background: transparent !important;
                              border-radius: 0 !important;
                              margin: 0 0 0 0px !important;
                              padding: 0 !important;
                              {% if is_state('input_boolean.wohnzimmer_tv_kindersicherung', 'off') %}
                              filter: grayscale(1) opacity(0.5);
                              pointer-events: none;
                              {% endif %}
                            }
                  - type: custom:mushroom-template-card
                    entity: counter.wohnzimmer_tv_watch_minutes
                    primary: TV-Zeitverbrauch heute
                    secondary: >
                      {% set verbrauch = states('counter.wohnzimmer_tv_watch_minutes') | float(0) %}
                      {% set limit = states('input_number.wohnzimmer_tv_timer_number') | float(1) %}
                      {% set rest = limit - verbrauch %}
                      {{ verbrauch | round(0) }} / {{ limit | round(0) }} min
                      {% if rest > 0 %}
                        (noch {{ rest | round(0) }} min)
                      {% else %}
                        (Limit erreicht!)
                      {% endif %}
                    icon: mdi:clock-time-eight
                    icon_color: >
                      {% set verbrauch = states('counter.wohnzimmer_tv_watch_minutes') | float(0) %}
                      {% set limit = states('input_number.wohnzimmer_tv_timer_number') | float(1) %}
                      {% set prozent = (verbrauch / limit * 100) | round(0) %}
                      {% if prozent < 50 %}
                        green
                      {% elif prozent < 75 %}
                        yellow
                      {% elif prozent < 100 %}
                        orange
                      {% else %}
                        red
                      {% endif %}
                    tap_action:
                      action: >
                        {% if is_state('input_boolean.wohnzimmer_tv_kindersicherung', 'off') %}
                        none
                        {% else %}
                        more-info
                        {% endif %}
                    card_mod:
                      style: |
                        ha-card {
                          border: none !important;
                          box-shadow: none !important;
                          background: transparent !important;
                          border-radius: 0 !important;
                          margin: 0 0 0 -21px !important;
                          padding: 0 !important;
                          position: relative;
                          {% if is_state('input_boolean.wohnzimmer_tv_kindersicherung', 'off') %}
                          filter: grayscale(1) opacity(0.5);
                          pointer-events: none;
                          {% endif %}
                        }
                        ha-card:after {
                          content: "";
                          position: absolute;
                          bottom: 0;
                          left: 0;
                          height: 4px;
                          background: 
                            {% set verbrauch = states('counter.wohnzimmer_tv_watch_minutes') | float(0) %}
                            {% set limit = states('input_number.wohnzimmer_tv_timer_number') | float(1) %}
                            {% set prozent = (verbrauch / limit * 100) | round(0) %}
                            {% if prozent < 50 %}
                              var(--green-color)
                            {% elif prozent < 75 %}
                              var(--yellow-color)
                            {% elif prozent < 100 %}
                              var(--orange-color)
                            {% else %}
                              var(--red-color)
                            {% endif %};
                          width: 
                            {% set verbrauch = states('counter.wohnzimmer_tv_watch_minutes') | float(0) %}
                            {% set limit = states('input_number.wohnzimmer_tv_timer_number') | float(1) %}
                            {% set prozent = (verbrauch / limit * 100) | round(0) %}
                            {{ [prozent, 100] | min }}%;
                          border-radius: 2px;
                        }

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.wohnzimmer_tv_kindersicherung
                state: 'on'
            card:
              type: markdown
              content: >
                **👨‍👩‍👧 Kindersicherung ist aktiv.**   (noch **{{
                states('input_number.wohnzimmer_tv_timer_number') | float |
                round(0) | int - 
                states('counter.wohnzimmer_tv_watch_minutes') | float |
                round(0) | int }} Minuten** übrig)


                Wenn die erlaubte Zeit von **{{
                states('input_number.wohnzimmer_tv_timer_number') | float |
                round(0) | int }} Minuten** erreicht ist, wird die Steckdose
                **automatisch ausgeschaltet**.
              card_mod: !include /config/ui/shared/styles/markdown_plain.yaml # Markdown Plain Style
